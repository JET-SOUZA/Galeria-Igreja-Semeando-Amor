name: Test Semeando Live V7.0 Broadcast Pro
on:
  push:
    paths: ['.github/workflows/test-v70-broadcast-pro.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check live-v5/v70-broadcast-pro.js
          node --check live-v5/v59-setlist.js
          grep -q 'v70-broadcast-pro.js?v=7001' live-v5/v59-setlist.js
          grep -q 'V7.0 · BROADCAST PRO' live-v5/v59-setlist.js
          grep -q 'Saídas independentes e simultâneas' live-v5/v70-broadcast-pro.js
          grep -q "audience" live-v5/v70-broadcast-pro.js
          grep -q "broadcast" live-v5/v70-broadcast-pro.js
          grep -q "stage" live-v5/v70-broadcast-pro.js
          grep -q "lobby" live-v5/v70-broadcast-pro.js
          grep -q 'v69-output-designer.js' live-v5/v59-setlist.js
          echo 'PASS V7.0 syntax and bootstrap'
          echo 'PASS independent audience broadcast stage lobby profiles'
          echo 'PASS simultaneous output launcher'
          echo 'PASS V6.9 and previous modules preserved'
          echo 'ALL_V70_BROADCAST_PRO_TESTS_PASSED'
