name: Test Semeando Live V6.5 Operator
on:
  push:
    paths: ['.github/workflows/test-v65-operator.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check live-v5/v65-operator-pro.js
          node --check live-v5/v59-setlist.js
          grep -q 'v65-operator-pro.js?v=6501' live-v5/v59-setlist.js
          grep -q 'PAINEL OPERADOR PRO' live-v5/v65-operator-pro.js
          grep -q 'MÚSICAS FAVORITAS' live-v5/v65-operator-pro.js
          grep -q 'LOOKS RÁPIDOS' live-v5/v65-operator-pro.js
          grep -q 'v64-scenes.js' live-v5/v59-setlist.js
          grep -q 'v63-automation.js' live-v5/v59-setlist.js
          echo 'PASS V6.5 module syntax'
          echo 'PASS concentrated operator controls'
          echo 'PASS favorites and looks integration'
          echo 'PASS previous modules preserved'
          echo 'ALL_V65_OPERATOR_TESTS_PASSED'
