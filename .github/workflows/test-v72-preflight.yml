name: Test Semeando Live V7.2 Preflight
on:
  push:
    paths: ['.github/workflows/test-v72-preflight.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check live-v5/v72-preflight.js
          node --check live-v5/v59-setlist.js
          grep -q 'v72-preflight.js?v=7201' live-v5/v59-setlist.js
          grep -q 'V7.2 · CENTRAL PRÉ-CULTO' live-v5/v59-setlist.js
          grep -q 'PRONTO PARA O CULTO' live-v5/v72-preflight.js
          grep -q 'CULTO / ROTEIRO' live-v5/v72-preflight.js
          grep -q 'MÚSICAS' live-v5/v72-preflight.js
          grep -q 'BÍBLIA' live-v5/v72-preflight.js
          grep -q 'SAÍDAS' live-v5/v72-preflight.js
          grep -q 'v71-safety.js' live-v5/v59-setlist.js
          echo 'ALL_V72_PREFLIGHT_TESTS_PASSED'
