name: V11.5 validation
on:
  push:
    paths:
      - 'live-v5/v115-mapping-slices.js'
      - 'live-v5/arena.html'
      - 'live-v5/v59-setlist.js'
      - '.github/workflows/v115-check.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check live-v5/v115-mapping-slices.js
          node --check live-v5/v59-setlist.js
      - name: Integration markers
        run: |
          grep -q "SemeandoV115" live-v5/v115-mapping-slices.js
          grep -q "v115-mapping-slices.js" live-v5/v59-setlist.js
          grep -q "v115-mapping-slices.js" live-v5/arena.html
          grep -q "MAPPING / SLICES" live-v5/v115-mapping-slices.js
          grep -q "GRADE DE CALIBRAÇÃO" live-v5/v115-mapping-slices.js
          grep -q "AJUSTE DE 4 CANTOS" live-v5/v115-mapping-slices.js