name: Semeando Smoke Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Start app
        run: |
          (npx next start -p 3000 > /tmp/semeando-next.log 2>&1 & echo $! > /tmp/semeando-next.pid)
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/cadastro > /tmp/cadastro.html; then exit 0; fi
            sleep 1
          done
          cat /tmp/semeando-next.log
          exit 1

      - name: Validate cadastro route
        run: |
          grep -q "Cadastro de visitante" /tmp/cadastro.html
          grep -q "Libere seu acesso" /tmp/cadastro.html
          grep -q "Possui energia solar" /tmp/cadastro.html
          grep -q "Data de nascimento" /tmp/cadastro.html

      - name: Validate privacy route
        run: |
          curl -fsS http://127.0.0.1:3000/privacidade > /tmp/privacidade.html
          grep -qi "CPF" /tmp/privacidade.html
          grep -qi "data de nascimento" /tmp/privacidade.html

      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/semeando-next.pid ]; then kill $(cat /tmp/semeando-next.pid) || true; fi
