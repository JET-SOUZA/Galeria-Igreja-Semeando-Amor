name: Test Semeando Live V6.1 Worship
on:
  push:
    paths: ['.github/workflows/test-v61-worship.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser test V6.1
        run: |
          node --check live-v5/v61-worship.js
          grep -q 'v61-worship.js?v=6101' live-v5/v59-setlist.js
          grep -q 'syncRetry' live-v5/v61-worship.js
          grep -q 'SemeandoV58' live-v5/v61-worship.js
          grep -q 'v60-liveflow.js' live-v5/v59-setlist.js
          echo 'PASS V6.1 module syntax'
          echo 'PASS V6.1 bootstrap integration'
          echo 'PASS V6.0 preserved'
          echo 'ALL_V61_WORSHIP_TESTS_PASSED'
