name: Install Semeando Live V5.9
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/install-v59.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install V5.9 module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('live-v5/index.html');s=p.read_text()
          s=s.replace('V5.8 · EDITOR PROFISSIONAL DE MÚSICAS','V5.9 · REPERTÓRIO E SETLIST')
          if 'v59-setlist.js' not in s:
              marker='<script src="v58-song-editor.js?v=5802"></script>'
              if marker not in s: raise SystemExit('v58 script marker missing')
              s=s.replace(marker,marker+'<script src="v59-setlist.js?v=5901"></script>',1)
          p.write_text(s)
          PY
          grep -q 'v59-setlist.js?v=5901' live-v5/index.html
          grep -q 'V5.9 · REPERTÓRIO E SETLIST' live-v5/index.html
          node --check live-v5/v59-setlist.js
      - name: Commit
        run: |
          git config user.name 'Legacy desenvolvedor'
          git config user.email '103953894+JET-SOUZA@users.noreply.github.com'
          git add live-v5/index.html
          git commit -m 'Enable Semeando Live V5.9 setlist workflow'
          git push
