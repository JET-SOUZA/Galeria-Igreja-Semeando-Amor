name: Test Semeando Live V6.2 Stage
on:
  push:
    paths: ['.github/workflows/test-v62-stage.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check live-v5/v62-stage.js
          node --check live-v5/v59-setlist.js
          grep -q 'v62-stage.js?v=6201' live-v5/v59-setlist.js
          grep -q 'CONTROLE PRIVADO DO PALCO' live-v5/v62-stage.js
          grep -q 'AVISO DA TÉCNICA' live-v5/v62-stage.js
          grep -q 'v61-worship.js' live-v5/v59-setlist.js
          grep -q 'v60-liveflow.js' live-v5/v59-setlist.js
          echo 'PASS V6.2 stage module syntax'
          echo 'PASS private stage notice control'
          echo 'PASS current/next stage layout'
          echo 'PASS V6.1 and V6.0 preserved'
          echo 'ALL_V62_STAGE_TESTS_PASSED'
