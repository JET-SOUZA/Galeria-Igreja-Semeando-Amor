name: Test Semeando Live V5.8 Song Editor
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-v58-song-editor.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser test V5.8
        run: |
          cat > test-v58.mjs <<'JS'
          import { chromium } from 'playwright';
          import { spawn } from 'node:child_process';
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const server=spawn('python3',['-m','http.server','8765'],{stdio:'ignore'});await wait(700);
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}}),errs=[];
          page.on('pageerror',e=>errs.push(e.message));
          await page.addInitScript(()=>localStorage.setItem('sl_selected_service_id','svc1'));
          const mock=`(()=>{const M=window.__m={services:[{id:'svc1',title:'Culto Teste V58',service_date:'2026-08-28T20:00:00Z',status:'ready',notes:null,created_at:'2026-08-20T00:00:00Z'}],items:[{id:'item1',service_id:'svc1',item_type:'song',title:'Louvor Teste',sort_order:0,song_id:'song1',payload:{background:1,durationMinutes:5,block:'Louvor'}}],songs:[{id:'song1',title:'Louvor Teste',artist:'Equipe Teste',key_signature:'G'}],slides:[{id:'p1',song_id:'song1',label:'Parte 1',body:'LINHA V1',sort_order:0},{id:'p2',song_id:'song1',label:'Parte 2',body:'LINHA R',sort_order:1},{id:'p3',song_id:'song1',label:'Parte 3',body:'LINHA V2',sort_order:2},{id:'p4',song_id:'song1',label:'Parte 4',body:'LINHA P',sort_order:3},{id:'p5',song_id:'song1',label:'Parte 5',body:'LINHA F',sort_order:4}],live:{channel:'audience',revision:1,state:{type:'welcome',title:'BEM-VINDOS',body:'',background:0,kicker:'WELCOME',blackout:false}}};function client(){const profile={full_name:'Operador Teste',role:'admin',is_active:true};function q(t,m='select',payload=null){let filters=[],lim=null,orders=[];const o={select(){return o},eq(k,v){filters.push([k,v]);return o},in(k,v){filters.push([k,v]);return o},order(k,opt={}){orders.push([k,opt]);return o},limit(v){lim=v;return o},insert(v){return q(t,'insert',v)},update(v){return q(t,'update',v)},upsert(v){return q(t,'upsert',v)},delete(){return q(t,'delete')},maybeSingle(){return Promise.resolve(run(true))},single(){return Promise.resolve(run(true))},then(a,b){return Promise.resolve(run(false)).then(a,b)}};const match=x=>filters.every(([k,v])=>Array.isArray(v)?v.includes(x[k]):x[k]===v);const sort=a=>{for(const[k,opt]of orders)a.sort((x,y)=>{const ax=x[k]??'',ay=y[k]??'';return(opt?.ascending===false?-1:1)*(ax>ay?1:ax<ay?-1:0)});return lim?a.slice(0,lim):a};function ret(a,one){a=sort(a.filter(match));return{data:one?(a[0]||null):a,error:null}}function run(one){if(t==='sl_profiles')return{data:profile,error:null};if(t==='sl_services'){if(m==='insert'){const src=Array.isArray(payload)?payload[0]:payload,row={id:'svc'+(M.services.length+1),...src,created_at:new Date().toISOString()};M.services.push(row);return{data:row,error:null}}if(m==='update'){const x=M.services.find(match);if(x)Object.assign(x,payload);return{data:x||null,error:null}}return ret([...M.services],one)}if(t==='sl_service_items'){if(m==='insert'){const rows=(Array.isArray(payload)?payload:[payload]).map((x,i)=>({id:x.id||'newItem'+(M.items.length+i+1),...x}));M.items.push(...rows);return{data:one?rows[0]:rows,error:null}}if(m==='update'){const hits=M.items.filter(match);hits.forEach(x=>Object.assign(x,payload));return{data:one?(hits[0]||null):hits,error:null}}return ret([...M.items],one)}if(t==='sl_songs')return ret([...M.songs],one);if(t==='sl_song_slides'){if(m==='update'){const hits=M.slides.filter(match);hits.forEach(x=>Object.assign(x,payload));return{data:one?(hits[0]||null):hits,error:null}}if(m==='insert'){const rows=Array.isArray(payload)?payload:[payload];M.slides.push(...rows);return{data:one?rows[0]:rows,error:null}}return ret([...M.slides],one)}if(t==='sl_live_state'){if(m==='update'||m==='upsert'){M.live={...M.live,...payload};return{data:one?M.live:[M.live],error:null}}return{data:one?M.live:[M.live],error:null}}if(t==='sl_media'||t==='sl_scripture_cache'||t==='sl_scenes'||t==='sl_command_log')return{data:one?null:[],error:null};return{data:one?null:[],error:null}}return o}return{auth:{getSession:async()=>({data:{session:{user:{id:'u1'}}}}),getUser:async()=>({data:{user:{id:'u1'}}}),signOut:async()=>({})},from:t=>q(t),storage:{from:()=>({getPublicUrl:path=>({data:{publicUrl:'https://media.test/'+path}}),upload:async()=>({data:{path:'x'},error:null}),remove:async()=>({data:[],error:null})})},channel:()=>({on(){return this},subscribe(cb){setTimeout(()=>cb('SUBSCRIBED'),1);return this}})}}window.supabase={createClient:client}})();`;
          await page.route('https://cdn.jsdelivr.net/**',r=>r.fulfill({status:200,contentType:'application/javascript',body:mock}));
          await page.goto('http://127.0.0.1:8765/live-v5/index.html');
          await page.waitForSelector('#operator:not(.hide)',{timeout:12000});
          const pass=async(n,f)=>{await f();console.log('PASS',n)};
          await pass('V5.8 and V5.7 UI coexist',async()=>{if(await page.locator('#servicesBtn').count()!==1)throw Error('services missing');if((await page.locator('body').textContent()).includes('V5.7 · CULTOS E MODELOS'))throw Error('old version label')});
          await pass('open song with core hook',async()=>{await page.locator('[data-tab="songs"]').click();await page.waitForSelector('#songList .song .pv');await page.locator('#songList .song .pv').first().click();await page.waitForSelector('#songNow:not(.hide)');if(await page.locator('#editSongV58').count()!==1)throw Error('editor button');if(await page.locator('#slides .slide').count()!==5)throw Error('initial slides')});
          await pass('edit section labels',async()=>{await page.click('#editSongV58');await page.waitForSelector('#musicEditor58[open]');if(await page.locator('#me58Rows .me58Row').count()!==5)throw Error('editor rows');const labels=['Verso 1','Refrão','Verso 2','Ponte','Final'];for(let i=0;i<labels.length;i++)await page.locator('#me58Rows .me58Row .lbl').nth(i).fill(labels[i]);await page.click('#me58SaveSections');await page.waitForFunction(()=>window.__m.slides.map(x=>x.label).join('|')==='Verso 1|Refrão|Verso 2|Ponte|Final',{timeout:7000});await page.waitForFunction(()=>document.querySelectorAll('#songSectionBar .secGroup').length===5,{timeout:7000});if(!await page.locator('#musicEditor58').evaluate(x=>x.open))throw Error('dialog closed after save');await page.waitForFunction(()=>document.querySelectorAll('#me58Available button').length===5,{timeout:7000})});
          await pass('build repeated chorus arrangement',async()=>{await page.click('#me58Natural');const add=async label=>{const b=page.locator('#me58Available button').filter({hasText:label}).first();if(await b.count()!==1)throw Error('section '+label);await b.click()};for(const x of ['Verso 1','Refrão','Verso 2','Refrão','Ponte','Refrão','Final'])await add(x);if(await page.locator('#me58Order .me58Step').count()!==7)throw Error('order steps');await page.click('#me58SaveOrder');await page.waitForFunction(()=>window.__m.items[0].payload.songArrangement?.join('|')==='Verso 1|Refrão|Verso 2|Refrão|Ponte|Refrão|Final',{timeout:7000});await page.waitForFunction(()=>document.querySelectorAll('#slides .slide').length===7,{timeout:7000});const got=await page.locator('#slides .slide .slideHead b').allTextContents(),want=['Verso 1','Refrão','Verso 2','Refrão','Ponte','Refrão','Final'];if(JSON.stringify(got)!==JSON.stringify(want))throw Error('rendered order '+JSON.stringify(got))});
          await pass('section shortcuts preview and live',async()=>{await page.click('#me58Close');const groups=page.locator('#songSectionBar .secGroup'),n=await groups.count();let chorus=-1;for(let i=0;i<n;i++){if((await groups.nth(i).locator('.secPreview').textContent()).trim()==='R'){chorus=i;break}}if(chorus<0)throw Error('chorus shortcut');await groups.nth(chorus).locator('.secPreview').click();await page.waitForFunction(()=>document.querySelector('#preview h2')?.textContent==='LINHA R');await groups.nth(chorus).locator('.secGo').click();await page.waitForFunction(()=>document.querySelector('#live h2')?.textContent==='LINHA R',{timeout:5000})});
          if(errs.length)throw Error('page errors: '+errs.join(' | '));
          console.log('ALL_V58_SONG_EDITOR_TESTS_PASSED');await browser.close();server.kill();
          JS
          node test-v58.mjs
