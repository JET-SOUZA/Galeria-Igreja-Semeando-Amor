name: Test Semeando Live V8.3 Compositor
on:
  push:
    paths: ['.github/workflows/test-v83-compositor.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check live-v5/v83-output-compositor.js
          node --check live-v5/v59-setlist.js
          grep -q 'v83-output-compositor.js?v=8301' live-v5/v59-setlist.js
          grep -q 'V8.3 · COMPOSITOR AO VIVO' live-v5/v59-setlist.js
          grep -q 'sl-v83-compositor' live-v5/v83-output-compositor.js
          grep -q 'Composição enviada ao telão' live-v5/v83-output-compositor.js
          grep -q 'playbackRate' live-v5/v83-output-compositor.js
          grep -q 'BroadcastChannel' live-v5/v83-output-compositor.js
          echo ALL_V83_COMPOSITOR_TESTS_PASSED
