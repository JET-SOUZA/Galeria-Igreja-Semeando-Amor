name: Test Semeando Live V6.0 Live Flow
on:
  push:
    paths: ['.github/workflows/test-v60-liveflow.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser test V6.0
        run: |
          cat > test-v60.mjs <<'JS'
          import { chromium } from 'playwright';
          import { spawn } from 'node:child_process';
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const server=spawn('python3',['-m','http.server','8765'],{stdio:'ignore'});await wait(700);
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}}),errs=[];
          page.on('pageerror',e=>errs.push(e.message));page.on('dialog',d=>d.accept());
          await page.addInitScript(()=>localStorage.setItem('sl_selected_service_id','svc1'));
          const mock=`(()=>{const M=window.__m={services:[{id:'svc1',title:'Culto V60',service_date:'2026-08-28T20:00:00Z',status:'ready',created_at:'2026-08-20T00:00:00Z'}],items:[{id:'i1',service_id:'svc1',item_type:'song',title:'Louvor 1',song_id:'s1',sort_order:0,payload:{durationMinutes:5,block:'Louvor'}},{id:'i2',service_id:'svc1',item_type:'scripture',title:'Palavra',sort_order:1,payload:{durationMinutes:30,block:'Palavra'}},{id:'i3',service_id:'svc1',item_type:'announcement',title:'Avisos',sort_order:2,payload:{durationMinutes:5,block:'Avisos'}}],songs:[{id:'s1',title:'Louvor 1',artist:'Equipe'}],slides:[{id:'a1',song_id:'s1',label:'Verso 1',body:'LINHA TESTE',sort_order:0}],live:{channel:'audience',revision:1,state:{type:'welcome',title:'BEM-VINDOS',body:'',background:0,kicker:'WELCOME',blackout:false}}};function client(){const profile={full_name:'Operador Teste',role:'admin',is_active:true};function q(t,m='select',payload=null){let filters=[],orders=[];const o={select(){return o},eq(k,v){filters.push([k,v]);return o},in(k,v){filters.push([k,v]);return o},order(k,opt={}){orders.push([k,opt]);return o},limit(){return o},insert(v){return q(t,'insert',v)},update(v){return q(t,'update',v)},upsert(v){return q(t,'upsert',v)},delete(){return q(t,'delete')},maybeSingle(){return Promise.resolve(run(true))},single(){return Promise.resolve(run(true))},then(a,b){return Promise.resolve(run(false)).then(a,b)}};const match=x=>filters.every(([k,v])=>Array.isArray(v)?v.includes(x[k]):x[k]===v);function table(){if(t==='sl_services')return M.services;if(t==='sl_service_items')return M.items;if(t==='sl_songs')return M.songs;if(t==='sl_song_slides')return M.slides;return []}function ret(a,one){a=a.filter(match);for(const[k,opt]of orders)a.sort((x,y)=>(opt?.ascending===false?-1:1)*((x[k]??'')>(y[k]??'')?1:(x[k]??'')<(y[k]??'')?-1:0));return{data:one?(a[0]||null):a,error:null}}function run(one){if(t==='sl_profiles')return{data:profile,error:null};if(t==='sl_live_state')return{data:one?M.live:[M.live],error:null};if(['sl_media','sl_scripture_cache','sl_scenes','sl_command_log'].includes(t))return{data:one?null:[],error:null};let a=table();if(m==='update'){const hits=a.filter(match);hits.forEach(x=>Object.assign(x,payload));return{data:one?(hits[0]||null):hits,error:null}}return ret([...a],one)}return o}return{auth:{getSession:async()=>({data:{session:{user:{id:'u1'}}}}),getUser:async()=>({data:{user:{id:'u1'}}}),signOut:async()=>({}),signInWithPassword:async()=>({data:{},error:null})},from:t=>q(t),storage:{from:()=>({getPublicUrl:path=>({data:{publicUrl:'https://media.test/'+path}})})},channel:()=>({on(){return this},subscribe(cb){setTimeout(()=>cb('SUBSCRIBED'),1);return this}})}}window.supabase={createClient:client}})();`;
          await page.route('https://cdn.jsdelivr.net/**',r=>r.fulfill({status:200,contentType:'application/javascript',body:mock}));
          await page.goto('http://127.0.0.1:8765/live-v5/index.html');
          await page.waitForSelector('#operator:not(.hide)',{timeout:12000});
          await page.waitForSelector('#v60dock',{timeout:6000});
          const pass=async(n,f)=>{await f();console.log('PASS',n)};
          await pass('V6.0 dock and V5.9 preserved',async()=>{if(await page.locator('#v60dock').count()!==1)throw Error('dock');await page.locator('[data-tab="songs"]').click();await page.waitForSelector('#v59bar',{timeout:3000})});
          await pass('current and next',async()=>{if(!(await page.locator('#v60dock').innerText()).includes('Louvor 1'))throw Error('current');if(!(await page.locator('#v60dock').innerText()).includes('Palavra'))throw Error('next')});
          await pass('complete advances flow',async()=>{await page.locator('#v60done').click();await page.waitForFunction(()=>window.__m.items[0].payload.completed===true);if(!(await page.locator('#v60dock').innerText()).includes('Palavra'))throw Error('advance')});
          await pass('operator note persists',async()=>{await page.fill('#v60note','Entrada após oração');await page.locator('#v60saveNote').click();await page.waitForFunction(()=>window.__m.items[1].payload.operatorNote==='Entrada após oração')});
          await pass('manual selection and reopen',async()=>{await page.locator('[data-sel="i3"]').click();if(!(await page.locator('#v60dock').innerText()).includes('Avisos'))throw Error('select');await page.locator('[data-done="i1"]').click();await page.waitForFunction(()=>window.__m.items[0].payload.completed===false)});
          if(errs.length)throw Error('page errors: '+errs.join(' | '));console.log('ALL_V60_LIVEFLOW_TESTS_PASSED');
          await browser.close();server.kill();
          JS
          node test-v60.mjs
