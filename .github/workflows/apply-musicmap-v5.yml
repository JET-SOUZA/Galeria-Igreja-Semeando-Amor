name: Apply Semeando Live V5 Music Map

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-musicmap-v5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply music map patch
        shell: bash
        run: |
          python - <<'PY'
          import base64,zlib,json
          from pathlib import Path
          p=Path("live-v5/index.html")
          s=p.read_text()
          pairs=json.loads(zlib.decompress(base64.b64decode("")))
          for a,b in pairs:
              if a not in s: raise SystemExit("patch anchor missing")
              s=s.replace(a,b)
          p.write_text(s)
          PY
      - name: Validate music operator
        run: |
          grep -q 'id="songMap"' live-v5/index.html
          grep -q 'AO AR' live-v5/index.html
          grep -q 'takeSlide' live-v5/index.html
          grep -q 'Shift+1–9' live-v5/index.html
      - name: Publish update
        run: |
          git config user.name 'Semeando Live Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add live-v5/index.html
          git commit -m 'Improve live worship song navigation'
          git push
