name: Test Semeando Live V7.1 Safety
on:
  push:
    paths: ['.github/workflows/test-v71-safety.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check live-v5/v71-safety.js
          node --check live-v5/v59-setlist.js
          grep -q 'v71-safety.js?v=7101' live-v5/v59-setlist.js
          grep -q 'V7.1 · SEGURANÇA OPERACIONAL' live-v5/v59-setlist.js
          grep -q 'Proteger comandos críticos' live-v5/v71-safety.js
          grep -q 'Abrir/reabrir 4 saídas' live-v5/v71-safety.js
          grep -q 'Desfazer emergência' live-v5/v71-safety.js
          grep -q 'heartbeat' live-v5/v71-safety.js
          grep -q 'v70-broadcast-pro.js' live-v5/v59-setlist.js
          echo 'ALL_V71_SAFETY_TESTS_PASSED'
