name: Test Semeando Live V5.9 Setlist
on:
  push:
    paths: ['.github/workflows/test-v59-setlist.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser test V5.9
        run: |
          cat > test-v59.mjs <<'JS'
          import { chromium } from 'playwright';
          import { spawn } from 'node:child_process';
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const server=spawn('python3',['-m','http.server','8765'],{stdio:'ignore'});await wait(700);
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}}),errs=[];
          page.on('pageerror',e=>errs.push(e.message));page.on('dialog',d=>d.accept());
          await page.addInitScript(()=>localStorage.setItem('sl_selected_service_id','svc1'));
          const mock=`(()=>{const M=window.__m={services:[{id:'svc1',title:'Culto V59',service_date:'2026-08-28T20:00:00Z',status:'ready',created_at:'2026-08-20T00:00:00Z'}],items:[{id:'i1',service_id:'svc1',item_type:'song',title:'Alpha',song_id:'s1',sort_order:0,payload:{background:1,durationMinutes:5,block:'Louvor'}},{id:'i2',service_id:'svc1',item_type:'song',title:'Beta',song_id:'s2',sort_order:1,payload:{background:1,durationMinutes:5,block:'Louvor'}}],songs:[{id:'s1',title:'Alpha',artist:'Equipe'},{id:'s2',title:'Beta',artist:'Equipe'},{id:'s3',title:'Gamma',artist:'Equipe'}],slides:[{id:'a1',song_id:'s1',label:'Verso 1',body:'LINHA ALPHA',sort_order:0},{id:'b1',song_id:'s2',label:'Refrão',body:'LINHA BETA',sort_order:0},{id:'g1',song_id:'s3',label:'Verso 1',body:'LINHA GAMMA',sort_order:0}],live:{channel:'audience',revision:1,state:{type:'welcome',title:'BEM-VINDOS',body:'',background:0,kicker:'WELCOME',blackout:false}}};let seq=10;function client(){const profile={full_name:'Operador Teste',role:'admin',is_active:true};function q(t,m='select',payload=null){let filters=[],lim=null,orders=[];const o={select(){return o},eq(k,v){filters.push([k,v]);return o},in(k,v){filters.push([k,v]);return o},order(k,opt={}){orders.push([k,opt]);return o},limit(v){lim=v;return o},insert(v){return q(t,'insert',v)},update(v){return q(t,'update',v)},upsert(v){return q(t,'upsert',v)},delete(){return q(t,'delete')},maybeSingle(){return Promise.resolve(run(true))},single(){return Promise.resolve(run(true))},then(a,b){return Promise.resolve(run(false)).then(a,b)}};const match=x=>filters.every(([k,v])=>Array.isArray(v)?v.includes(x[k]):x[k]===v);const sort=a=>{for(const[k,opt]of orders)a.sort((x,y)=>{const ax=x[k]??'',ay=y[k]??'';return(opt?.ascending===false?-1:1)*(ax>ay?1:ax<ay?-1:0)});return lim?a.slice(0,lim):a};const ret=(a,one)=>{a=sort(a.filter(match));return{data:one?(a[0]||null):a,error:null}};function table(){if(t==='sl_services')return M.services;if(t==='sl_service_items')return M.items;if(t==='sl_songs')return M.songs;if(t==='sl_song_slides')return M.slides;return []}function run(one){if(t==='sl_profiles')return{data:profile,error:null};if(t==='sl_live_state'){if(m==='update'||m==='upsert'){M.live={...M.live,...payload};return{data:one?M.live:[M.live],error:null}}return{data:one?M.live:[M.live],error:null}}if(['sl_media','sl_scripture_cache','sl_scenes','sl_command_log'].includes(t))return{data:one?null:[],error:null};let a=table();if(m==='insert'){const rows=(Array.isArray(payload)?payload:[payload]).map(x=>({id:x.id||'n'+(++seq),...x}));a.push(...rows);return{data:one?rows[0]:rows,error:null}}if(m==='update'){const hits=a.filter(match);hits.forEach(x=>Object.assign(x,payload));return{data:one?(hits[0]||null):hits,error:null}}if(m==='delete'){const hits=a.filter(match);for(const x of hits){const i=a.indexOf(x);if(i>=0)a.splice(i,1)}return{data:one?(hits[0]||null):hits,error:null}}return ret([...a],one)}return o}return{auth:{getSession:async()=>({data:{session:{user:{id:'u1'}}}}),getUser:async()=>({data:{user:{id:'u1'}}}),signOut:async()=>({}),signInWithPassword:async()=>({data:{},error:null})},from:t=>q(t),storage:{from:()=>({getPublicUrl:path=>({data:{publicUrl:'https://media.test/'+path}}),upload:async()=>({data:{path:'x'},error:null}),remove:async()=>({data:[],error:null})})},channel:()=>({on(){return this},subscribe(cb){setTimeout(()=>cb('SUBSCRIBED'),1);return this}})}}window.supabase={createClient:client}})();`;
          await page.route('https://cdn.jsdelivr.net/**',r=>r.fulfill({status:200,contentType:'application/javascript',body:mock}));
          await page.goto('http://127.0.0.1:8765/live-v5/index.html');
          await page.waitForSelector('#operator:not(.hide)',{timeout:12000});
          await page.locator('[data-tab="songs"]').click();
          await page.waitForSelector('#v59bar',{timeout:6000});
          const pass=async(n,f)=>{await f();console.log('PASS',n)};
          await pass('V5.9 UI and setlist',async()=>{if(await page.locator('#v59set .v59row').count()!==2)throw Error('initial setlist');if(await page.locator('[data-f="fav"]').count()!==1)throw Error('filters')});
          await pass('favorites and instant search',async()=>{await page.locator('[data-star="s3"]').click();let f=await page.evaluate(()=>JSON.parse(localStorage.getItem('sl_v59_favorites')||'[]'));if(!f.includes('s3'))throw Error('favorite');await page.fill('#v59search','Gamma');if(await page.locator('#songList .song').count()!==1)throw Error('search')});
          await pass('add to service',async()=>{await page.locator('[data-add="s3"]').click();await page.waitForFunction(()=>window.__m.items.some(x=>x.song_id==='s3'));if(await page.locator('#v59set .v59row').count()!==3)throw Error('add setlist')});
          await pass('reorder setlist',async()=>{const row=page.locator('#v59set .v59row').filter({hasText:'Gamma'});await row.locator('[data-up]').click();await page.waitForFunction(()=>window.__m.items.find(x=>x.song_id==='s3').sort_order===1);if((await page.locator('#v59set .v59row').nth(1).textContent()).indexOf('Gamma')<0)throw Error('move')});
          await pass('preview routes to core V5.8',async()=>{await page.fill('#v59search','Gamma');await page.locator('[data-open="s3"]').click();await page.waitForSelector('#songNow:not(.hide)',{timeout:5000});if(await page.locator('#editSongV58').count()!==1)throw Error('v58 editor missing');let r=await page.evaluate(()=>JSON.parse(localStorage.getItem('sl_v59_recent')||'[]'));if(r[0]!=='s3')throw Error('recent')});
          await pass('remove from service',async()=>{await page.evaluate(()=>window.SemeandoV59.reload());await page.waitForTimeout(150);const row=page.locator('#v59set .v59row').filter({hasText:'Gamma'});await row.locator('[data-rm]').click();await page.waitForFunction(()=>!window.__m.items.some(x=>x.song_id==='s3'));if(await page.locator('#v59set .v59row').count()!==2)throw Error('remove')});
          if(errs.length)throw Error('page errors: '+errs.join(' | '));console.log('ALL_V59_SETLIST_TESTS_PASSED');
          await browser.close();server.kill();
          JS
          node test-v59.mjs
