name: Upgrade Semeando Live V5.1 Music Map

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/upgrade-semeando-live-v51-music-map.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply verified V5.1 patch
        env:
          PATCH_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json,gzip,base64,hashlib
          p=Path('live-v5/index.html')
          s=p.read_text()
          old_sha=hashlib.sha256(s.encode()).hexdigest()
          assert old_sha=='294d060b8c9abe28dbdc9370b5e0cc25daafdef48d785791c3bf89c321a13cbb', f'unexpected source {old_sha}'
          ops=json.loads(gzip.decompress(base64.b64decode(os.environ['PATCH_B64'])))
          for i1,i2,repl in sorted(ops,key=lambda x:x[0],reverse=True):
              s=s[:i1]+repl+s[i2:]
          new_sha=hashlib.sha256(s.encode()).hexdigest()
          assert new_sha=='154088ee70104c3eb41933b5a755299538298c3fb5d46c18be9e70211b1a8d58', f'unexpected target {new_sha}'
          Path('/tmp/index.html').write_text(s)
          PY
          grep -q 'id="songMap"' /tmp/index.html
          grep -q 'takeSlide' /tmp/index.html
          grep -q 'goSlide' /tmp/index.html
          grep -q 'Shift+1–9' /tmp/index.html
          grep -q '>AO AR<' /tmp/index.html

      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/index.html').read_text()
          blocks=re.findall(r'<script>(.*?)</script>',t,re.S)
          assert blocks
          Path('/tmp/app.js').write_text(blocks[-1])
          PY
          node --check /tmp/app.js

      - name: Publish V5.1
        run: |
          cp /tmp/index.html live-v5/index.html
          git config user.name 'Semeando Live Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add live-v5/index.html
          git diff --cached --check
          git commit -m 'Upgrade Semeando Live to V5.1 song operator map'
          git push
