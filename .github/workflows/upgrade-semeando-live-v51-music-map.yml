name: Upgrade Semeando Live V5.1 Music Map

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/upgrade-semeando-live-v51-music-map.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build V5.1 operator song map
        shell: bash
        run: |
          cat > /tmp/v51.b64 <<'B64'

B64
          base64 -d /tmp/v51.b64 | gzip -d > /tmp/index.html
          test "$(sha256sum /tmp/index.html | awk '{print $1}')" = "154088ee70104c3eb41933b5a755299538298c3fb5d46c18be9e70211b1a8d58"
          grep -q 'id="songMap"' /tmp/index.html
          grep -q 'takeSlide' /tmp/index.html
          grep -q 'goSlide' /tmp/index.html
          grep -q 'Shift+1–9' /tmp/index.html
          grep -q '>AO AR<' /tmp/index.html

      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('/tmp/index.html').read_text()
          blocks=re.findall(r'<script>(.*?)</script>', text, re.S)
          assert blocks, 'inline script not found'
          Path('/tmp/app.js').write_text(blocks[-1])
          PY
          node --check /tmp/app.js

      - name: Publish V5.1
        run: |
          cp /tmp/index.html live-v5/index.html
          git config user.name 'Semeando Live Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add live-v5/index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'V5.1 already published'
          else
            git commit -m 'Upgrade Semeando Live to V5.1 song operator map'
            git push
          fi
