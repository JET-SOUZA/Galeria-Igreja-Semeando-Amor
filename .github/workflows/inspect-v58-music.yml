name: Inspect V5.8 Music Core
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-v58-music.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact music functions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('live-v5/index.html').read_text()
          def extract(marker):
              i=s.find(marker)
              if i<0:return f'NOT FOUND: {marker}'
              b=s.find('{',i); depth=0; quote=None; esc=False
              for j in range(b,len(s)):
                  c=s[j]
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                      continue
                  if c in "'\"`": quote=c; continue
                  if c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:return s[i:j+1]
              return s[i:i+12000]
          markers=['function showSlides','async function previewSong','function takeSlide','function showSongs','function renderSongs','async function loadItems','function renderRundown','function paint']
          parts=[]
          for m in markers:
              parts.append('\n===== '+m+' =====\n'+extract(m)+'\n')
          Path('live-v5/_v58-functions.txt').write_text(''.join(parts))
          PY
      - name: Commit exact functions
        run: |
          git config user.name 'Legacy desenvolvedor'
          git config user.email '103953894+JET-SOUZA@users.noreply.github.com'
          git add live-v5/_v58-functions.txt
          git commit -m 'Extract exact V5.8 music functions'
          git push
