name: Inspect V5.8 Music Core
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-v58-music.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract music core snippets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('live-v5/index.html').read_text()
          needles=['data-tab="songs"','data-panel="songs"','id="songNow"','function showSlides','async function previewSong','function takeSlide','function renderSongs','function showSongs','sl_song_slides','async function loadItems','function renderRundown','function paint']
          out=[]
          for n in needles:
              i=s.find(n)
              out.append('\n===== '+n+' @ '+str(i)+' =====\n')
              if i>=0: out.append(s[max(0,i-1800):min(len(s),i+6500)])
          Path('live-v5/_v58-snippets.txt').write_text(''.join(out))
          PY
      - name: Commit snippets
        run: |
          git config user.name 'Legacy desenvolvedor'
          git config user.email '103953894+JET-SOUZA@users.noreply.github.com'
          git add live-v5/_v58-snippets.txt
          git commit -m 'Extract V5.8 music core snippets'
          git push
