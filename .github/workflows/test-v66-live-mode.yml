name: Test Semeando Live V6.6 Live Mode
on:
  push:
    paths: ['.github/workflows/test-v66-live-mode.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check live-v5/v66-live-mode.js
          node --check live-v5/v59-setlist.js
          grep -q 'v66-live-mode.js?v=6601' live-v5/v59-setlist.js
          grep -q 'V6.6 · MODO CULTO' live-v5/v59-setlist.js
          grep -q 'MODO CULTO' live-v5/v66-live-mode.js
          grep -q 'AGORA' live-v5/v66-live-mode.js
          grep -q 'PRÓXIMO' live-v5/v66-live-mode.js
          grep -q 'BLACKOUT' live-v5/v66-live-mode.js
          grep -q 'SemeandoV66' live-v5/v66-live-mode.js
          grep -q 'v65-operator-pro.js' live-v5/v59-setlist.js
          echo 'PASS V6.6 syntax and bootstrap'
          echo 'PASS simplified live controls'
          echo 'PASS mobile live mode and recovery state'
          echo 'PASS V6.5 and previous modules preserved'
          echo 'ALL_V66_LIVE_MODE_TESTS_PASSED'
