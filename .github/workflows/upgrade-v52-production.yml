name: Upgrade Semeando Live V5.2 Production

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/upgrade-v52-production.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V5.2 production controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('live-v5/index.html')
          s=p.read_text()
          def rep(a,b):
              global s
              if a not in s:
                  raise SystemExit('anchor missing: '+a[:80])
              s=s.replace(a,b,1)

          css='''.liveBadge{display:inline-flex;align-items:center;gap:6px;border:1px solid #5b2630;background:#2a1016;color:#ff8b97;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:900;letter-spacing:.08em}.liveDot{width:7px;height:7px;border-radius:50%;background:#ff6675;box-shadow:0 0 0 4px #ff667522}.topClock{font-size:11px;font-weight:850;color:#d7dde7;min-width:48px;text-align:center}.prodGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.prodCard{border:1px solid var(--line);background:#10151d;border-radius:13px;padding:12px}.prodCard h3{margin:0 0 9px;font-size:11px;letter-spacing:.06em}.prodCard p{font-size:9px;color:var(--mut);line-height:1.45}.prodActions{display:flex;gap:7px;flex-wrap:wrap}.prodActions .btn,.prodActions .take{flex:1;min-width:110px}.timerRead{font-size:28px;font-weight:950;letter-spacing:.04em;margin:4px 0 10px}.outLower{position:absolute;left:5vw;bottom:6vh;max-width:62vw;background:#090b0eea;border-left:6px solid var(--o);padding:14px 18px 13px;border-radius:5px 12px 12px 5px;box-shadow:0 18px 50px #0009}.outLower b{display:block;font-size:clamp(24px,2.4vw,48px)}.outLower span{display:block;margin-top:4px;font-size:clamp(15px,1.45vw,28px);color:#d5dbe5}.stageTimerBox{min-width:160px;text-align:center;border:1px solid #ffffff26;background:#0009;padding:10px 14px;border-radius:12px}.stageTimerBox small{display:block;color:#ffad72;font-weight:900}.stageTimerBox b{display:block;font-size:34px;margin-top:4px}.stageNext{max-width:56vw}.prodStatus{font-size:9px;color:var(--mut);min-height:15px;margin-top:8px}.prodStatus.ok{color:var(--g)}@media(max-width:760px){.prodGrid{grid-template-columns:1fr}.liveBadge{grid-column:2}.topClock{grid-column:3}.top .grow{display:none}.prodCard{padding:11px}.outLower{left:4vw;right:4vw;max-width:none;bottom:4vh}}'''
          rep('</style>',css+'</style>')

          rep('<span id="health" class="health">● Conectando</span><div class="grow"></div>', '<span id="health" class="health">● Conectando</span><span class="liveBadge"><i class="liveDot"></i> AO VIVO</span><span id="topClock" class="topClock">--:--</span><div class="grow"></div>')

          rep('<button class="tab" data-tab="macros">Macros</button></nav>', '<button class="tab" data-tab="macros">Macros</button><button class="tab" data-tab="production">Produção</button></nav>')

          prod='''<section class="panel" data-panel="production"><div class="prodGrid"><div class="prodCard"><h3>LOWER THIRD</h3><div class="field"><label>Nome / título</label><input id="lowerTitle" placeholder="Pr. Nome"></div><div class="field"><label>Função / complemento</label><input id="lowerSub" placeholder="Pastor · Igreja Semeando Amor"></div><div class="prodActions"><button id="previewLower" class="btn" type="button">Preview</button><button id="liveLower" class="take" type="button">AO AR</button><button id="clearLower" class="btn danger" type="button">Limpar</button></div></div><div class="prodCard"><h3>MENSAGEM RÁPIDA</h3><div class="field"><label>Título</label><input id="quickTitle" placeholder="ATENÇÃO"></div><div class="field"><label>Mensagem</label><textarea id="quickBody" rows="4" placeholder="Escreva a mensagem"></textarea></div><div class="prodActions"><button id="previewQuick" class="btn" type="button">Preview</button><button id="liveQuick" class="take" type="button">AO AR</button></div></div><div class="prodCard"><h3>TIMER DE PALCO</h3><div class="grid2"><div class="field"><label>Minutos</label><input id="timerMinutes" type="number" min="1" max="240" value="30"></div><div><div class="label">Contagem</div><div id="prodTimer" class="timerRead">30:00</div></div></div><div class="prodActions"><button id="startTimer" class="take" type="button">Iniciar</button><button id="resetTimer" class="btn danger" type="button">Zerar</button></div><div id="prodStatus" class="prodStatus">O timer aparece apenas no Stage.</div></div><div class="prodCard"><h3>SEGURANÇA DE CULTO</h3><p>Preview nunca altera o telão. Use IR AO AR para confirmar. Blackout mantém o estado e pode ser revertido imediatamente.</p><div class="prodActions"><button id="prodBlack" class="btn danger" type="button">Blackout</button><button id="prodClear" class="btn" type="button">Limpar texto</button><button id="prodUndo" class="btn" type="button">Desfazer</button></div></div></div></section>'''
          rep('<section class="panel" data-panel="macros"><div id="macroGrid" class="macroGrid"></div></section></div></section><aside class="pane right">', '<section class="panel" data-panel="macros"><div id="macroGrid" class="macroGrid"></div></section>'+prod+'</div></section><aside class="pane right">')

          rep('<div id="stage" class="stage hide"><div><small>PRÓXIMO</small><b id="nextText">—</b></div><strong id="clock" class="clock"></strong></div><span id="outHealth" class="outHealth">LOCAL</span></div>', '<div id="stage" class="stage hide"><div class="stageNext"><small>PRÓXIMO</small><b id="nextText">—</b></div><div class="stageTimerBox"><small>TIMER</small><b id="stageTimer">--:--</b></div><strong id="clock" class="clock"></strong></div><div id="outLower" class="outLower hide"><b id="outLowerTitle"></b><span id="outLowerSub"></span></div><span id="outHealth" class="outHealth">LOCAL</span></div>')

          helpers='''function setProdStatus(t,ok=false){const e=$('#prodStatus');if(!e)return;e.textContent=t;e.className='prodStatus'+(ok?' ok':'')}function lowerData(){return{title:$('#lowerTitle')?.value.trim()||'',subtitle:$('#lowerSub')?.value.trim()||'',visible:true}}function previewLowerThird(){A.preview={...A.preview,lowerThird:lowerData()};render();setProdStatus('Lower third preparado no Preview.',true)}async function liveLowerThird(){const lt=lowerData();await publish(A.channel,{...A.live,lowerThird:lt},'lower-third');setProdStatus('Lower third enviado ao ar.',true)}async function clearLowerThird(){await publish(A.channel,{...A.live,lowerThird:{visible:false,title:'',subtitle:''}},'lower-third-clear');setProdStatus('Lower third removido.',true)}function previewQuick(){A.slides=[];A.slide=-1;A.currentSong=null;showSlides();A.preview=mk('announcement',$('#quickTitle')?.value.trim()||'ATENÇÃO',$('#quickBody')?.value.trim()||'',4,'AVISO');render();setProdStatus('Mensagem preparada no Preview.',true)}async function liveQuick(){previewQuick();await take();setProdStatus('Mensagem enviada ao ar.',true)}let prodTimerEnd=0,prodTimerTick=null;function tickProdTimer(){const el=$('#prodTimer');if(!el)return;let ms=prodTimerEnd-Date.now();if(ms<0)ms=0;const sec=Math.floor(ms/1000),m=Math.floor(sec/60),s=sec%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}async function startTimer(){const mins=Math.max(1,Math.min(240,Number($('#timerMinutes')?.value||30)));prodTimerEnd=Date.now()+mins*60000;clearInterval(prodTimerTick);prodTimerTick=setInterval(tickProdTimer,500);tickProdTimer();const{data}=await sb.from('sl_live_state').select('state').eq('channel','stage').maybeSingle();await publish('stage',{...(data?.state||{}),timerEnd:new Date(prodTimerEnd).toISOString()},'timer-start');setProdStatus('Timer de palco iniciado.',true)}async function resetTimer(){prodTimerEnd=0;clearInterval(prodTimerTick);const el=$('#prodTimer');if(el)el.textContent='00:00';const{data}=await sb.from('sl_live_state').select('state').eq('channel','stage').maybeSingle();await publish('stage',{...(data?.state||{}),timerEnd:null},'timer-reset');setProdStatus('Timer zerado.',true)}'''
          rep('function tabs(){',helpers+'function tabs(){')

          setup_anchor="$('#contentHub').onclick=()=>window.open('https://semeando-live-conteudo.vercel.app','sl-content');"
          setup_add=setup_anchor+"$('#previewLower').onclick=previewLowerThird;$('#liveLower').onclick=liveLowerThird;$('#clearLower').onclick=clearLowerThird;$('#previewQuick').onclick=previewQuick;$('#liveQuick').onclick=liveQuick;$('#startTimer').onclick=startTimer;$('#resetTimer').onclick=resetTimer;$('#prodBlack').onclick=blackout;$('#prodClear').onclick=clear;$('#prodUndo').onclick=undo;setInterval(()=>{const c=$('#topClock');if(c)c.textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})},1000);"
          rep(setup_anchor,setup_add)

          rep("async function out(){const ch=qs.get('channel')||'audience',p=await getProfile();", "async function out(){let outTimerEnd=0;const ch=qs.get('channel')||'audience',p=await getProfile();")
          rep("if(isStage)$('#nextText').textContent=s.next||'—'}", "if(isStage)$('#nextText').textContent=s.next||'—';outTimerEnd=s.timerEnd?Date.parse(s.timerEnd):0;const lt=s.lowerThird||{};$('#outLower').classList.toggle('hide',!lt.visible||!lt.title);$('#outLowerTitle').textContent=lt.title||'';$('#outLowerSub').textContent=lt.subtitle||''}")
          rep("setInterval(()=>$('#clock').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),500);", "setInterval(()=>{$('#clock').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});const e=$('#stageTimer');if(e){let ms=outTimerEnd?outTimerEnd-Date.now():0;if(ms<0)ms=0;const sec=Math.floor(ms/1000),m=Math.floor(sec/60),x=sec%60;e.textContent=outTimerEnd?(String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')):'--:--'}},500);")
          rep('V5 · BÍBLIA + REPERTÓRIO','V5.2 · PRODUÇÃO AO VIVO')
          rep('<small>V5</small></div><div class="rightBody">','<small>V5.2</small></div><div class="rightBody">')
          p.write_text(s)
          PY
      - name: Validate V5.2
        run: |
          grep -q 'data-panel="production"' live-v5/index.html
          grep -q 'id="lowerTitle"' live-v5/index.html
          grep -q 'id="stageTimer"' live-v5/index.html
          grep -q 'id="outLower"' live-v5/index.html
          grep -q 'V5.2 · PRODUÇÃO AO VIVO' live-v5/index.html
          python - <<'PY'
          import re, pathlib, subprocess, tempfile
          s=pathlib.Path('live-v5/index.html').read_text()
          blocks=re.findall(r'<script>([\s\S]*?)</script>',s)
          js=blocks[-1]
          p=pathlib.Path('/tmp/check.js');p.write_text('new Function('+repr(js)+');')
          subprocess.run(['node',str(p)],check=True)
          PY
      - name: Commit upgrade
        run: |
          git config user.name 'Semeando Live Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add live-v5/index.html
          git commit -m 'Upgrade Semeando Live to V5.2 production controls'
          git push
