name: Test Semeando Live V5.6 Professional Rundown

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-v56-rundown.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser test V5.6
        run: |
          cat > test-v56.mjs <<'JS'
          import { chromium } from 'playwright';
          import { spawn } from 'node:child_process';
          const server=spawn('python3',['-m','http.server','8765'],{stdio:'ignore'}),wait=ms=>new Promise(r=>setTimeout(r,ms));await wait(700);
          const browser=await chromium.launch({headless:true}),page=await browser.newPage({viewport:{width:1280,height:900}}),errs=[];
          page.on('pageerror',e=>errs.push(e.message));
          await page.route('https://cdn.jsdelivr.net/**',async r=>r.fulfill({status:200,contentType:'application/javascript',body:`window.supabase={createClient(){let items=[{id:'i1',service_id:'svc',item_type:'song',title:'Louvor Teste',sort_order:0,song_id:'s1',payload:{background:1}},{id:'i2',service_id:'svc',item_type:'scripture',title:'João 3:16',sort_order:1,song_id:null,payload:{title:'João 3:16',body:'Texto',background:5}},{id:'i3',service_id:'svc',item_type:'announcement',title:'Avisos',sort_order:2,song_id:null,payload:{body:'Avisos',background:4}}],song={id:'s1',title:'Louvor Teste',artist:'Equipe',key_signature:'G'},slides=[{id:'1',song_id:'s1',label:'Verso 1',body:'Linha 1',sort_order:0},{id:'2',song_id:'s1',label:'Refrão',body:'Linha 2',sort_order:1}],service={id:'svc',title:'Culto Teste',status:'live'},profile={full_name:'Operador',role:'admin',is_active:true},live={revision:1,state:{type:'welcome',title:'BEM-VINDOS',body:'Teste',background:0,kicker:'WELCOME',blackout:false}};const result=(t,m,p)=>t==='sl_profiles'?{data:profile,error:null}:t==='sl_services'?{data:[service],error:null}:t==='sl_service_items'?{data:items,error:null}:t==='sl_songs'?{data:[song],error:null}:t==='sl_song_slides'?{data:slides,error:null}:t==='sl_media'?{data:[],error:null}:t==='sl_live_state'?{data:m==='update'?{revision:2,state:p||live.state}:live,error:null}:t==='sl_scripture_cache'?{data:[],error:null}:{data:[],error:null};function q(t,m='select',p=null){const o={select(){return o},eq(k,v){if(t==='sl_service_items'&&m==='update'){const x=items.find(z=>z[k]===v);if(x){if(p.payload)x.payload=p.payload;if(Number.isInteger(p.sort_order))x.sort_order=p.sort_order}}return o},in(){return o},order(){if(t==='sl_service_items')items=[...items].sort((a,b)=>a.sort_order-b.sort_order);return o},limit(){return o},insert(v){return q(t,'insert',v)},update(v){return q(t,'update',v)},upsert(v){return q(t,'upsert',v)},delete(){return q(t,'delete')},maybeSingle(){return Promise.resolve(result(t,m,p))},single(){return Promise.resolve(result(t,m,p))},then(a,b){return Promise.resolve(result(t,m,p)).then(a,b)}};return o}return{auth:{getSession:async()=>({data:{session:{user:{id:'u'}}}}),getUser:async()=>({data:{user:{id:'u'}}}),signOut:async()=>({})},from:t=>q(t),storage:{from:()=>({getPublicUrl:path=>({data:{publicUrl:'https://media.test/'+path}}),upload:async()=>({data:{path:'x'},error:null}),remove:async()=>({data:[],error:null})})},channel:()=>({on(){return this},subscribe(cb){setTimeout(()=>cb('SUBSCRIBED'),1);return this}})}}};` }));
          await page.goto('http://127.0.0.1:8765/live-v5/index.html');await page.waitForSelector('#operator:not(.hide)',{timeout:10000});
          const pass=async(n,f)=>{await f();console.log('PASS',n)},click=async s=>{await page.locator(s).first().click();await wait(80)};
          await pass('rundown loads and totals',async()=>{if(await page.locator('.rundownItem').count()!==3)throw Error('item count');if((await page.locator('#rundownDuration').textContent()).trim()!=='42 min')throw Error('duration')});
          await pass('edit duration and block',async()=>{const first=page.locator('.rundownItem').first();await first.locator('.durInp').fill('8');await first.locator('.durInp').press('Tab');await wait(120);if(!(await page.locator('#rundownDuration').textContent()).includes('45'))throw Error('duration update');await first.locator('.blockSel').selectOption('Abertura');await wait(100);if(!(await page.locator('.rundownItem').first().locator('.rundownMeta').textContent()).includes('Abertura'))throw Error('block')});
          await pass('song expands',async()=>{await page.locator('.rundownItem').first().locator('.expand').click();await page.waitForSelector('.rundownPart');if(await page.locator('.rundownPart').count()!==2)throw Error('parts')});
          await pass('preview indicator',async()=>{await page.locator('.rundownItem').first().locator('.pv').click();await wait(100);if(await page.locator('.rundownBadge.pre').count()!==1)throw Error('preview badge')});
          await pass('planning mode',async()=>{await click('#prepModeBtn');if(!(await page.locator('body').getAttribute('class')||'').includes('prepMode'))throw Error('prep on');await click('#prepModeBtn');if((await page.locator('body').getAttribute('class')||'').includes('prepMode'))throw Error('prep off')});
          await pass('go live indicator',async()=>{await page.locator('.rundownItem').first().locator('.go').click();await wait(140);if(await page.locator('.rundownBadge.live').count()!==1)throw Error('live badge')});
          await pass('drag reorder and save',async()=>{const rows=page.locator('.rundownItem');const before=await rows.first().locator('.rundownTitleRow b').textContent();await rows.first().dragTo(rows.nth(2));await wait(120);const after=await page.locator('.rundownItem').first().locator('.rundownTitleRow b').textContent();if(after===before)throw Error('drag did not reorder');await click('#saveRundown');await wait(100);if(!(await page.locator('#saveRundown').textContent()).includes('Salvo'))throw Error('save')});
          await pass('core controls preserved',async()=>{await click('#black');await click('#undo');await click('[data-tab="media"]');if(await page.locator('#mediaLibraryGrid').count()!==1)throw Error('media missing')});
          if(errs.length)throw Error('page errors: '+errs.join(' | '));console.log('ALL_V56_RUNDOWN_TESTS_PASSED');await browser.close();server.kill();
          JS
          node test-v56.mjs
