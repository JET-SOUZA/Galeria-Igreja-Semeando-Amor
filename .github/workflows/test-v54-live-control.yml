name: Test Semeando Live V5.4 Live Control

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-v54-live-control.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser test V5.4
        run: |
          cat > test-v54.mjs <<'JS'
          import { chromium } from 'playwright';
          import { spawn } from 'node:child_process';
          const server=spawn('python3',['-m','http.server','8765'],{stdio:'ignore'}),wait=ms=>new Promise(r=>setTimeout(r,ms));await wait(700);
          const browser=await chromium.launch({headless:true}),page=await browser.newPage({viewport:{width:1280,height:900}}),errs=[];
          page.on('pageerror',e=>errs.push(e.message));
          await page.route('https://cdn.jsdelivr.net/**',async r=>r.fulfill({status:200,contentType:'application/javascript',body:`window.supabase={createClient(){const song={id:'s1',title:'Louvor Teste',artist:'Equipe',key_signature:'G'},slides=[{id:'1',song_id:'s1',label:'Verso 1',body:'Linha 1\\nLinha 2',sort_order:0},{id:'2',song_id:'s1',label:'Refrão',body:'Refrão\\nLinha',sort_order:1}],service={id:'svc',title:'Culto Teste',status:'live'},profile={full_name:'Operador',role:'admin',is_active:true},live={revision:1,state:{type:'welcome',title:'BEM-VINDOS',body:'Teste',background:0,kicker:'WELCOME',blackout:false}};const R=(t,m,p)=>t==='sl_profiles'?{data:profile,error:null}:t==='sl_services'?{data:[service],error:null}:t==='sl_service_items'?{data:[],error:null}:t==='sl_songs'?{data:[song],error:null}:t==='sl_song_slides'?{data:slides,error:null}:t==='sl_live_state'?{data:m==='update'?{revision:2,state:p||live.state}:live,error:null}:t==='sl_scripture_cache'?{data:[],error:null}:{data:[],error:null};function q(t,m='select',p=null){const o={select(){return o},eq(){return o},in(){return o},order(){return o},limit(){return o},insert(v){return q(t,'insert',v)},update(v){return q(t,'update',v)},upsert(v){return q(t,'upsert',v)},maybeSingle(){return Promise.resolve(R(t,m,p))},single(){return Promise.resolve(R(t,m,p))},then(a,b){return Promise.resolve(R(t,m,p)).then(a,b)}};return o}return{auth:{getSession:async()=>({data:{session:{user:{id:'u'}}}}),getUser:async()=>({data:{user:{id:'u'}}}),signOut:async()=>({})},from:t=>q(t),channel:()=>({on(){return this},subscribe(cb){setTimeout(()=>cb('SUBSCRIBED'),1);return this}})}}};`}));
          await page.goto('http://127.0.0.1:8765/live-v5/index.html');await page.waitForSelector('#operator:not(.hide)',{timeout:10000});
          const click=async s=>{await page.locator(s).first().click();await wait(50)},pass=async(n,f)=>{await f();console.log('PASS',n)};
          await pass('shortcut dialog',async()=>{await click('#shortcuts');if(!(await page.locator('#shortcutDialog').evaluate(e=>e.open)))throw Error('dialog');await click('#xShortcuts')});
          await pass('song metadata',async()=>{await click('[data-tab="songs"]');await click('.song .pv');await page.waitForSelector('#songNow:not(.hide)');await click('.previewSlide');const x=await page.evaluate(()=>({i:window.__x||0}));if(!(await page.locator('.songJump').count()>=2))throw Error('song map')});
          await pass('space take',async()=>{await page.keyboard.press('Space');await wait(100)});
          await pass('keyboard B C U',async()=>{await page.keyboard.press('b');await page.keyboard.press('c');await page.keyboard.press('u')});
          await pass('recovery save/restore',async()=>{await page.keyboard.press('Space');await click('[data-tab="production"]');await click('#restoreLast')});
          await pass('core buttons',async()=>{await click('#prodBlack');await click('#prodClear');await click('#prodUndo')});
          if(errs.length)throw Error(errs.join(' | '));console.log('ALL_V54_TESTS_PASSED');await browser.close();server.kill();
          JS
          node test-v54.mjs
