name: Refine Semeando Live V5.1 song labels

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refine-v51-song-labels.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Improve song jump labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('live-v5/index.html')
          s=p.read_text()
          old="j.textContent=shortLabel(s.label,i);j.title=s.label||('Parte '+(i+1));"
          new="label=s.label||('Parte '+(i+1)),first=String(s.body||'').split('\\n').find(x=>x.trim())||'',generic=/^parte\\s+\\d+$/i.test(label);j.textContent=(generic?String(i+1):shortLabel(label,i))+(first?' · '+first.slice(0,26):'');j.title=label+(first?' — '+first:'');"
          if "first.slice(0,26)" in s:
              print('Already refined')
          elif old in s:
              s=s.replace(old,new,1)
              p.write_text(s)
          else:
              raise SystemExit('song label anchor missing')
          PY
      - name: Validate
        run: |
          grep -q 'id="songMap"' live-v5/index.html
          grep -q 'first.slice(0,26)' live-v5/index.html
          grep -q 'takeSlide' live-v5/index.html
      - name: Publish
        run: |
          git config user.name 'Semeando Live Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add live-v5/index.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'Improve song jump labels for live operator'
            git push
          fi
