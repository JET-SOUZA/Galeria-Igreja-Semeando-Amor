name: Test Semeando Live V9.4 Inspector Pro
on:
  push:
    paths: ['.github/workflows/test-v94-inspector-pro.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check live-v5/v94-inspector-pro.js
          node --check live-v5/v59-setlist.js
          grep -q 'v94-inspector-pro.js?v=9401' live-v5/v59-setlist.js
          grep -q 'V9.4 · INSPECTOR PRO' live-v5/v94-inspector-pro.js
          grep -q 'BLEND MODE' live-v5/v94-inspector-pro.js
          grep -q 'ANIMAÇÃO DA LETRA' live-v5/v94-inspector-pro.js
          grep -q 'Worship' live-v5/v94-inspector-pro.js
          echo ALL_V94_INSPECTOR_PRO_TESTS_PASSED
