name: Test Semeando Live V7.4 Workspace
on:
  push:
    paths: ['.github/workflows/test-v74-default-workspace.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check live-v5/v74-default-workspace.js
          node --check live-v5/v59-setlist.js
          grep -q 'v74-default-workspace.js?v=7401' live-v5/v59-setlist.js
          grep -q 'V7.4 · WORKSPACE PADRÃO' live-v5/v59-setlist.js
          grep -q 'MENU AVANÇADO' live-v5/v74-default-workspace.js
          grep -q 'Voltar ao Workspace' live-v5/v74-default-workspace.js
          grep -q 'v73-workspace.js' live-v5/v59-setlist.js
          echo 'ALL_V74_DEFAULT_WORKSPACE_TESTS_PASSED'
