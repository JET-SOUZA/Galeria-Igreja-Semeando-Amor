name: Upgrade Semeando Live V5.6 Professional Rundown Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/upgrade-v56-rundown-fix.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V5.6
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('live-v5/index.html')
          s=p.read_text()

          css='''.rundownTools{padding:9px;border-bottom:1px solid var(--line);background:#0d1118}.rundownStats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:7px}.rundownStat{border:1px solid var(--line);background:#11161f;border-radius:9px;padding:7px}.rundownStat small{display:block;color:var(--mut);font-size:7px;text-transform:uppercase;letter-spacing:.08em}.rundownStat b{display:block;font-size:12px;margin-top:2px}.rundownMode{display:flex;gap:6px}.rundownMode button{flex:1}.rundownItem{border:1px solid transparent;background:#11161f;border-radius:10px;padding:8px;display:grid;grid-template-columns:20px 1fr auto;gap:7px;align-items:start;position:relative}.rundownItem:hover{border-color:#303a49}.rundownItem.dragging{opacity:.45}.rundownItem.dragOver{border-color:var(--o);box-shadow:0 0 0 1px var(--o)}.rundownItem.previewing{border-color:#9a541f;background:#21150d}.rundownItem.liveItem{border-color:#74303a;box-shadow:inset 3px 0 #ff6675}.rundownDrag{cursor:grab;color:#697586;font-size:15px;line-height:22px;text-align:center;user-select:none}.rundownMain{min-width:0}.rundownTitleRow{display:flex;align-items:center;gap:6px}.rundownTitleRow b{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.rundownBadge{font-size:7px;font-weight:950;border:1px solid var(--line);border-radius:999px;padding:2px 5px;color:#9ea9b8;white-space:nowrap}.rundownBadge.pre{border-color:#99511f;color:#ffb075}.rundownBadge.live{border-color:#6f3039;color:#ff8994}.rundownMeta{display:flex;gap:5px;align-items:center;margin-top:4px;color:#7f8998;font-size:8px;flex-wrap:wrap}.rundownBlock{color:#ffad72}.rundownActions{display:grid;gap:4px}.rundownActions button,.rundownPart{display:block!important;grid-template-columns:none!important;text-align:center!important;padding:5px 6px!important}.rundownActions button{border:1px solid var(--line);background:#151b24;border-radius:7px;font-size:8px;font-weight:900}.rundownActions .go{background:#ff7a1a;color:#1a0900;border:0}.rundownExpanded{grid-column:2/-1;border-top:1px solid var(--line);padding-top:7px;margin-top:2px}.rundownParts{display:flex;gap:5px;overflow-x:auto}.rundownPart{border:1px solid var(--line)!important;background:#0d1219!important;border-radius:7px!important;font-size:7px!important;white-space:nowrap}.rundownEdit{display:grid;grid-template-columns:1fr 58px;gap:5px;margin-top:7px}.rundownEdit select,.rundownEdit input{width:100%;border:1px solid var(--line);background:#090c11;color:var(--txt);border-radius:7px;padding:6px;font-size:8px}.prepMode .rundownActions .go{opacity:.45;pointer-events:none}.prepBanner{display:none;border:1px solid #4e3b25;background:#21170d;color:#ffbd87;border-radius:8px;padding:7px 8px;font-size:8px;margin-top:6px}.prepMode .prepBanner{display:block}.rundownEmpty{padding:12px;color:var(--mut);font-size:9px;text-align:center}@media(max-width:760px){.rundownTools{display:none}}'''
          s=s.replace('</style>',css+'</style>',1)
          s=s.replace('V5.4 · LIVE CONTROL','V5.6 · ROTEIRO PROFISSIONAL',1)
          s=s.replace('V5.5 · BIBLIOTECA DE MÍDIA','V5.6 · ROTEIRO PROFISSIONAL')

          old='<aside class="pane left"><div class="head"><b>ROTEIRO</b><small id="serviceName">Culto ao Vivo</small></div><div id="rundown" class="rundown"></div></aside>'
          new='''<aside class="pane left"><div class="head"><b>ROTEIRO</b><small id="serviceName">Culto ao Vivo</small></div><div class="rundownTools"><div class="rundownStats"><div class="rundownStat"><small>DURAÇÃO PREVISTA</small><b id="rundownDuration">0 min</b></div><div class="rundownStat"><small>FIM ESTIMADO</small><b id="rundownEnd">--:--</b></div></div><div class="rundownMode"><button id="prepModeBtn" class="btn" type="button">Planejar</button><button id="saveRundown" class="btn" type="button">Salvar ordem</button></div><div class="prepBanner">MODO PLANEJAR · envio direto AO AR bloqueado.</div></div><div id="rundown" class="rundown"></div></aside>'''
          if old not in s: raise SystemExit('aside anchor missing')
          s=s.replace(old,new,1)

          state_anchor="let A={profile:null,service:null,items:[],songs:[]"
          if state_anchor not in s: raise SystemExit('state anchor missing')
          s=s.replace(state_anchor,"let rundownPreviewId=null,rundownLiveId=null,rundownDragId=null,prepMode=false;let A={profile:null,service:null,items:[],songs:[]",1)

          start=s.index('function rundown(){')
          end=s.index('async function item(x){', start)
          newfun=r'''function defaultDuration(x){const t=x.item_type||'';if(t==='song')return 5;if(t==='scripture'||t==='word')return 30;if(t==='offering')return 8;if(t==='announcement')return 7;if(t==='prayer')return 10;if(t==='welcome')return 5;if(t==='closing')return 5;return 5}function itemDuration(x){return Math.max(1,Number(x.payload?.durationMinutes||defaultDuration(x))||5)}function itemBlock(x){if(x.payload?.block)return x.payload.block;const t=x.item_type||'';if(t==='song'||t==='worship')return'Louvor';if(t==='scripture'||t==='word'||t==='prayer')return'Palavra';if(t==='announcement')return'Avisos';if(t==='closing')return'Encerramento';return'Abertura'}function updateRundownStats(){const mins=A.items.reduce((n,x)=>n+itemDuration(x),0),d=$('#rundownDuration'),e=$('#rundownEnd');if(d)d.textContent=mins+' min';if(e){const end=new Date(Date.now()+mins*60000);e.textContent=end.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}}async function persistItemPayload(x,patch){const payload={...(x.payload||{}),...patch};x.payload=payload;await sb.from('sl_service_items').update({payload,updated_at:new Date().toISOString()}).eq('id',x.id)}async function persistRundownOrder(){if(!A.items.length)return;await Promise.all(A.items.map((x,i)=>{x.sort_order=i;return sb.from('sl_service_items').update({sort_order:i,updated_at:new Date().toISOString()}).eq('id',x.id)}));$('#saveRundown').textContent='Salvo ✓';setTimeout(()=>$('#saveRundown').textContent='Salvar ordem',900)}async function expandRundownSong(x,wrap){const box=wrap.querySelector('.rundownExpanded');if(!box||!x.song_id)return;if(!box.classList.contains('hide')){box.classList.add('hide');return}box.classList.remove('hide');box.innerHTML='<span class="hint">Carregando partes…</span>';const{data}=await sb.from('sl_song_slides').select('*').eq('song_id',x.song_id).order('sort_order');const rows=data||[];box.innerHTML='<div class="rundownParts"></div>';const p=box.querySelector('.rundownParts');rows.forEach((r,i)=>{const b=document.createElement('button');b.className='rundownPart';b.type='button';b.textContent=(r.label||('Parte '+(i+1)))+' · '+String(r.body||'').split('\n')[0].slice(0,18);b.onclick=async()=>{const song=A.songs.find(z=>z.id===x.song_id)||{id:x.song_id,title:x.title};await previewSong(song,x.payload?.background||1);setSlide(i,x.payload?.background||1);rundownPreviewId=x.id;rundown()};p.appendChild(b)});if(!rows.length)p.innerHTML='<span class="hint">Sem partes cadastradas.</span>'}function rundown(){const box=$('#rundown');box.innerHTML='';const rows=A.items.length?A.items:macros.map((m,i)=>({title:m[0],item_type:m[3],sort_order:i,payload:{background:m[4]}}));rows.forEach((x,i)=>{const d=document.createElement('div');d.className='rundownItem'+(x.id&&x.id===rundownPreviewId?' previewing':'')+(x.id&&x.id===rundownLiveId?' liveItem':'');if(x.id){d.draggable=true;d.dataset.id=x.id;d.ondragstart=()=>{rundownDragId=x.id;d.classList.add('dragging')};d.ondragend=()=>{rundownDragId=null;d.classList.remove('dragging');$$('.rundownItem').forEach(z=>z.classList.remove('dragOver'))};d.ondragover=e=>{e.preventDefault();d.classList.add('dragOver')};d.ondragleave=()=>d.classList.remove('dragOver');d.ondrop=e=>{e.preventDefault();d.classList.remove('dragOver');if(!rundownDragId||rundownDragId===x.id)return;const from=A.items.findIndex(z=>z.id===rundownDragId),to=A.items.findIndex(z=>z.id===x.id);if(from<0||to<0)return;const[m]=A.items.splice(from,1);A.items.splice(to,0,m);rundown()}}const block=itemBlock(x),dur=itemDuration(x),pre=x.id&&x.id===rundownPreviewId,live=x.id&&x.id===rundownLiveId;d.innerHTML=`<span class="rundownDrag">${x.id?'⋮⋮':String(i+1).padStart(2,'0')}</span><div class="rundownMain"><div class="rundownTitleRow"><b>${esc(x.title)}</b>${pre?'<span class="rundownBadge pre">PREVIEW</span>':''}${live?'<span class="rundownBadge live">AO AR</span>':''}</div><div class="rundownMeta"><span class="rundownBlock">${esc(block)}</span><span>·</span><span>${dur} min</span><span>·</span><span>${esc(x.item_type||'item')}</span></div>${x.id?`<div class="rundownEdit"><select class="blockSel"><option>Abertura</option><option>Louvor</option><option>Palavra</option><option>Avisos</option><option>Encerramento</option></select><input class="durInp" type="number" min="1" max="180" value="${dur}" title="Duração em minutos"></div>`:''}</div><div class="rundownActions"><button class="pv" type="button">Preview</button>${x.item_type==='song'&&x.id?'<button class="expand" type="button">Partes</button>':''}<button class="go" type="button">AO AR</button></div>${x.item_type==='song'&&x.id?'<div class="rundownExpanded hide"></div>':''}`;if(x.id){const sel=d.querySelector('.blockSel');sel.value=block;sel.onchange=async e=>{await persistItemPayload(x,{block:e.target.value});rundown()};const inp=d.querySelector('.durInp');inp.onchange=async e=>{const v=Math.max(1,Math.min(180,Number(e.target.value)||5));await persistItemPayload(x,{durationMinutes:v});rundown()}}d.querySelector('.pv').onclick=async()=>{await item(x);rundownPreviewId=x.id||null;rundown()};d.querySelector('.go').onclick=async()=>{if(prepMode)return;await item(x);rundownPreviewId=x.id||null;await take();rundownLiveId=x.id||null;rundown()};const ex=d.querySelector('.expand');if(ex)ex.onclick=()=>expandRundownSong(x,d);box.appendChild(d)});if(!rows.length)box.innerHTML='<div class="rundownEmpty">Adicione músicas, Bíblia ou cenas ao roteiro.</div>';updateRundownStats()}'''
          s=s[:start]+newfun+s[end:]

          # Replace any current #take handler safely.
          s,n=re.subn(r"\$\('#take'\)\.onclick=[^;]+;", "$('#take').onclick=async()=>{await take();if(rundownPreviewId){rundownLiveId=rundownPreviewId;rundown()}};", s, count=1)
          if n!=1: raise SystemExit('take setup anchor missing')

          setup2="$('#cult').onclick=()=>document.body.classList.toggle('cult');"
          if setup2 not in s: raise SystemExit('cult setup anchor missing')
          s=s.replace(setup2,"$('#prepModeBtn').onclick=()=>{prepMode=!prepMode;document.body.classList.toggle('prepMode',prepMode);$('#prepModeBtn').textContent=prepMode?'Planejando ✓':'Planejar'};$('#saveRundown').onclick=persistRundownOrder;"+setup2,1)

          p.write_text(s)
          PY
      - name: Validate V5.6
        run: |
          grep -q 'ROTEIRO PROFISSIONAL' live-v5/index.html
          grep -q 'persistRundownOrder' live-v5/index.html
          grep -q 'expandRundownSong' live-v5/index.html
          grep -q 'rundownDuration' live-v5/index.html
          grep -q 'prepModeBtn' live-v5/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('live-v5/index.html').read_text()
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/v56.js').write_text([x for x in scripts if x.strip()][-1])
          PY
          node --check /tmp/v56.js
      - name: Commit V5.6
        run: |
          git config user.name 'Legacy desenvolvedor'
          git config user.email '103953894+JET-SOUZA@users.noreply.github.com'
          git add live-v5/index.html
          git commit -m 'Upgrade Semeando Live to V5.6 professional rundown'
          git push
