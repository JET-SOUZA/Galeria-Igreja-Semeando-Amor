name: Semeando Final Validation
on:
  push:
    branches: [semeando-cadastro-validado]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build production-like app
        run: |
          rm -rf /tmp/semeando-ci
          mkdir -p /tmp/semeando-ci
          cp -R webapp/app /tmp/semeando-ci/app
          cp -R webapp/lib /tmp/semeando-ci/lib
          cat > /tmp/semeando-ci/package.json <<'EOF'
          {"name":"semeando-memorias-ci","private":true,"scripts":{"build":"next build"},"dependencies":{"next":"14.2.35","react":"18.3.1","react-dom":"18.3.1","jszip":"3.10.1"},"devDependencies":{"typescript":"5.9.2","@types/node":"22.18.0","@types/react":"18.3.24"}}
          EOF
          cd /tmp/semeando-ci
          npm install --no-audit --no-fund
          npm run build
      - name: Static source checks
        run: |
          grep -q "Data de nascimento" webapp/app/cadastro/page.tsx
          grep -q "CPF" webapp/app/cadastro/page.tsx
          grep -q "Possui energia solar" webapp/app/cadastro/page.tsx
          grep -q "Baixar Excel" webapp/app/admin/leads/page.tsx
          grep -q "Contato Legacy Solar" webapp/app/admin/leads/page.tsx
          grep -q "Encontre somente as suas fotos" webapp/app/evento/\[slug\]/page.tsx
