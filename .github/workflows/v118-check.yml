name: V11.8 validation
on: {push: {paths: ['live-v5/v118-effects-engine.js','live-v5/arena.html','live-v5/v59-setlist.js','.github/workflows/v118-check.yml']}}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check live-v5/v118-effects-engine.js
          node --check live-v5/v59-setlist.js
      - run: |
          grep -q 'SemeandoV118' live-v5/v118-effects-engine.js
          grep -q 'v118-effects-engine.js' live-v5/arena.html
          grep -q 'v118-effects-engine.js' live-v5/v59-setlist.js
          grep -q 'BRIGHTNESS' live-v5/v118-effects-engine.js
          grep -q 'CONTRAST' live-v5/v118-effects-engine.js
          grep -q 'SATURATE' live-v5/v118-effects-engine.js
          grep -q 'COMPOSITION' live-v5/v118-effects-engine.js