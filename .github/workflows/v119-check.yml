name: V11.9 validation
on: {push: {paths: ['live-v5/v119-browser-pro.js','live-v5/v118-effects-engine.js','live-v5/arena.html','live-v5/v59-setlist.js','.github/workflows/v119-check.yml']}}
jobs:
 validate:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: '22'}
   - run: |
      node --check live-v5/v119-browser-pro.js
      node --check live-v5/v118-effects-engine.js
      node --check live-v5/v59-setlist.js
   - run: |
      grep -q 'SemeandoV119' live-v5/v119-browser-pro.js
      grep -q 'BÍBLIA' live-v5/v119-browser-pro.js
      grep -q 'AVISOS' live-v5/v119-browser-pro.js
      grep -q 'FUNDOS' live-v5/v119-browser-pro.js
      grep -q 'CÂMERA' live-v5/v119-browser-pro.js
      grep -q 'v119-browser-pro.js' live-v5/arena.html
      grep -q 'v119-browser-pro.js' live-v5/v59-setlist.js
      grep -q 'SemeandoV118' live-v5/v118-effects-engine.js