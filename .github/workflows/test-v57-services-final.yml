name: Test Semeando Live V5.7 Services Final

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-v57-services-final.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser test V5.7 final
        run: |
          cat > test-v57.mjs <<'JS'
          import { chromium } from 'playwright';
          import { spawn } from 'node:child_process';
          const server=spawn('python3',['-m','http.server','8765'],{stdio:'ignore'}),wait=ms=>new Promise(r=>setTimeout(r,ms));await wait(700);
          const browser=await chromium.launch({headless:true}),page=await browser.newPage({viewport:{width:1280,height:900}}),errs=[];
          page.on('pageerror',e=>errs.push(e.message));
          await page.route('https://cdn.jsdelivr.net/**',async r=>r.fulfill({status:200,contentType:'application/javascript',body:`(()=>{const sel=localStorage.getItem('sl_selected_service_id');let base=[{id:'svc1',title:'Culto Principal',service_date:'2026-08-28T20:00:00Z',status:'ready',notes:null,created_at:'2026-08-20T00:00:00Z'},{id:'svc2',title:'Culto Anterior',service_date:'2026-08-21T20:00:00Z',status:'completed',notes:null,created_at:'2026-08-19T00:00:00Z'}];let items={svc1:[{id:'i1',service_id:'svc1',item_type:'welcome',title:'Boas-vindas',sort_order:0,song_id:null,payload:{background:0}}],svc2:[{id:'i2',service_id:'svc2',item_type:'closing',title:'Encerramento',sort_order:0,song_id:null,payload:{background:2}}]};if(sel==='new1'){base.unshift({id:'new1',title:'Culto de Domingo',service_date:new Date().toISOString(),status:'ready',notes:'Modelo Domingo',created_at:new Date().toISOString()});items.new1=[{id:'n1',service_id:'new1',item_type:'welcome',title:'Boas-vindas',sort_order:0,payload:{background:0,durationMinutes:5,block:'Abertura'}},{id:'n2',service_id:'new1',item_type:'song',title:'Louvor 1',sort_order:1,payload:{background:1,durationMinutes:5,block:'Louvor'}},{id:'n3',service_id:'new1',item_type:'song',title:'Louvor 2',sort_order:2,payload:{background:1,durationMinutes:5,block:'Louvor'}},{id:'n4',service_id:'new1',item_type:'word',title:'Palavra',sort_order:3,payload:{background:5,durationMinutes:35,block:'Palavra'}},{id:'n5',service_id:'new1',item_type:'offering',title:'Oferta',sort_order:4,payload:{background:0,durationMinutes:8,block:'Palavra'}},{id:'n6',service_id:'new1',item_type:'announcement',title:'Avisos',sort_order:5,payload:{background:4,durationMinutes:7,block:'Avisos'}},{id:'n7',service_id:'new1',item_type:'closing',title:'Encerramento',sort_order:6,payload:{background:2,durationMinutes:5,block:'Encerramento'}}]};if(sel==='dup1'){base.unshift({id:'dup1',title:'Culto de Domingo · Cópia',service_date:new Date().toISOString(),status:'ready',notes:'Duplicado',created_at:new Date().toISOString()});items.dup1=[{id:'d1',service_id:'dup1',item_type:'welcome',title:'Boas-vindas',sort_order:0,payload:{background:0,durationMinutes:5,block:'Abertura'}},{id:'d2',service_id:'dup1',item_type:'song',title:'Louvor 1',sort_order:1,payload:{background:1,durationMinutes:5,block:'Louvor'}},{id:'d3',service_id:'dup1',item_type:'song',title:'Louvor 2',sort_order:2,payload:{background:1,durationMinutes:5,block:'Louvor'}},{id:'d4',service_id:'dup1',item_type:'word',title:'Palavra',sort_order:3,payload:{background:5,durationMinutes:35,block:'Palavra'}},{id:'d5',service_id:'dup1',item_type:'offering',title:'Oferta',sort_order:4,payload:{background:0,durationMinutes:8,block:'Palavra'}},{id:'d6',service_id:'dup1',item_type:'announcement',title:'Avisos',sort_order:5,payload:{background:4,durationMinutes:7,block:'Avisos'}},{id:'d7',service_id:'dup1',item_type:'closing',title:'Encerramento',sort_order:6,payload:{background:2,durationMinutes:5,block:'Encerramento'}}]};window.__m={services:base,items,insertN:sel==='new1'?1:0};window.supabase={createClient(){const M=window.__m,profile={full_name:'Operador',role:'admin',is_active:true},song={id:'s1',title:'Louvor Teste'},live={revision:1,state:{type:'welcome',title:'BEM-VINDOS',body:'Teste',background:0,kicker:'WELCOME',blackout:false}};function q(t,m='select',payload=null){let filters=[],lim=null;const o={select(){return o},eq(k,v){filters.push([k,v]);return o},in(k,v){filters.push([k,v]);return o},order(){return o},limit(v){lim=v;return o},insert(v){return q(t,'insert',v)},update(v){return q(t,'update',v)},upsert(v){return q(t,'upsert',v)},delete(){return q(t,'delete')},maybeSingle(){return Promise.resolve(run(true))},single(){return Promise.resolve(run(true))},then(a,b){return Promise.resolve(run(false)).then(a,b)}};function match(x){return filters.every(([k,v])=>Array.isArray(v)?v.includes(x[k]):x[k]===v)}function run(one){if(t==='sl_profiles')return{data:profile,error:null};if(t==='sl_services'){if(m==='insert'){M.insertN++;const src=Array.isArray(payload)?payload[0]:payload,id=M.insertN===1?'new1':'dup1',row={id,...src,created_at:new Date().toISOString(),updated_at:new Date().toISOString()};M.services.unshift(row);return{data:row,error:null}}if(m==='update'){const x=M.services.find(match);if(x)Object.assign(x,payload);return{data:x||null,error:null}}let a=M.services.filter(match);if(lim)a=a.slice(0,lim);return{data:one?(a[0]||null):a,error:null}}if(t==='sl_service_items'){if(m==='insert'){const rows=Array.isArray(payload)?payload:[payload];for(const x of rows)(M.items[x.service_id]??=[]).push({...x,id:'z'+Math.random()});return{data:rows,error:null}}let all=Object.values(M.items).flat().filter(match).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));return{data:one?(all[0]||null):all,error:null}}if(t==='sl_songs')return{data:[song],error:null};if(t==='sl_song_slides')return{data:[],error:null};if(t==='sl_media')return{data:[],error:null};if(t==='sl_live_state')return{data:m==='update'?{revision:2,state:payload||live.state}:live,error:null};if(t==='sl_scripture_cache')return{data:[],error:null};return{data:[],error:null}}return o}return{auth:{getSession:async()=>({data:{session:{user:{id:'u'}}}}),getUser:async()=>({data:{user:{id:'u'}}}),signOut:async()=>({})},from:t=>q(t),storage:{from:()=>({getPublicUrl:path=>({data:{publicUrl:'https://media.test/'+path}}),upload:async()=>({data:{path:'x'},error:null}),remove:async()=>({data:[],error:null})})},channel:()=>({on(){return this},subscribe(cb){setTimeout(()=>cb('SUBSCRIBED'),1);return this}})}}}})();` }));
          const go=async()=>{await page.goto('http://127.0.0.1:8765/live-v5/index.html');await page.waitForSelector('#operator:not(.hide)',{timeout:10000});await page.waitForSelector('#servicesBtn',{timeout:5000})};await go();
          const pass=async(n,f)=>{await f();console.log('PASS',n)};
          await pass('services dialog and history',async()=>{await page.click('#servicesBtn');await page.waitForSelector('#servicesDialog[open]');await page.waitForFunction(()=>document.querySelectorAll('.svcCard').length>=2);if(await page.locator('.svcCard').count()<2)throw Error('history')});
          await pass('create Sunday template',async()=>{await page.locator('[data-template="Domingo"]').click();await page.waitForFunction(()=>localStorage.getItem('sl_selected_service_id')==='new1');await page.waitForFunction(()=>document.querySelector('#serviceName')?.textContent==='Culto de Domingo',{timeout:6000});if(await page.locator('.rundownItem').count()!==7)throw Error('template items')});
          await pass('duplicate current service',async()=>{await page.click('#servicesBtn');await page.waitForSelector('#servicesDialog[open]');await page.click('#duplicateService');await page.waitForFunction(()=>localStorage.getItem('sl_selected_service_id')==='dup1');await page.waitForFunction(()=>document.querySelector('#serviceName')?.textContent.includes('Cópia'),{timeout:6000});if(await page.locator('.rundownItem').count()!==7)throw Error('copy items')});
          await pass('switch service',async()=>{await page.click('#servicesBtn');await page.waitForSelector('#servicesDialog[open]');const card=page.locator('.svcCard').filter({hasText:'Culto Principal'});await card.locator('.use').click();await page.waitForFunction(()=>localStorage.getItem('sl_selected_service_id')==='svc1');await page.waitForFunction(()=>document.querySelector('#serviceName')?.textContent==='Culto Principal',{timeout:6000});if(await page.locator('.rundownItem').count()!==1)throw Error('wrong rundown')});
          await pass('status controls',async()=>{await page.click('#servicesBtn');await page.waitForSelector('#servicesDialog[open]');const card=page.locator('.svcCard').filter({hasText:'Culto Principal'});await card.locator('.live').click();await wait(100);if(!(await card.textContent()).includes('LIVE'))throw Error('live status');await card.locator('.done').click();await wait(100);if(!(await card.textContent()).includes('COMPLETED'))throw Error('completed status');await page.locator('#xServices').click()});
          await pass('core controls preserved',async()=>{await page.click('#black');await page.click('#undo');await page.locator('[data-tab="media"]').click();if(await page.locator('#mediaLibraryGrid').count()!==1)throw Error('media')});
          if(errs.length)throw Error('page errors: '+errs.join(' | '));console.log('ALL_V57_SERVICES_TESTS_PASSED');await browser.close();server.kill();
          JS
          node test-v57.mjs
