name: Test Semeando Live V9.6 Operator Grid Pro
on:
  push:
    paths: ['.github/workflows/test-v96-operator-grid-pro.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check live-v5/v96-operator-grid-pro.js
          node --check live-v5/v59-setlist.js
          grep -q 'v96-operator-grid-pro.js?v=9601' live-v5/v59-setlist.js
          grep -q 'V9.6 · OPERATOR GRID PRO' live-v5/v59-setlist.js
          grep -q 'v96thumb' live-v5/v96-operator-grid-pro.js
          grep -q 'AO VIVO' live-v5/v96-operator-grid-pro.js
          grep -q 'Solo' live-v5/v96-operator-grid-pro.js
          grep -q 'Mute' live-v5/v96-operator-grid-pro.js
          echo ALL_V96_OPERATOR_GRID_PRO_TESTS_PASSED
