name: Vercel Preview Semeando Memorias

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package.json

      - name: Require preview credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is required for the isolated preview deployment."
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate deploy source
        run: npm run check:deploy

      - name: Test ZIP extraction
        run: node scripts/test-zip-import.mjs

      - name: Install Vercel CLI
        run: npm install --no-save vercel@latest

      - name: Pull preview environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" --scope=legacy-solar

      - name: Build preview from repository source
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel build --token="$VERCEL_TOKEN" --scope=legacy-solar

      - name: Deploy preview only
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel deploy --prebuilt --token="$VERCEL_TOKEN" --scope=legacy-solar | tee /tmp/vercel-preview-url.txt
          echo "Preview URL: $(tail -n 1 /tmp/vercel-preview-url.txt)"
