name: Refine Semeando Live V5.8 Song Editor
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/upgrade-v58-song-editor.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh editor after section save
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('live-v5/v58-song-editor.js');s=p.read_text()
          old="status58('#me58SectionStatus','Seções salvas. Recarregando música…','ok');await core58.reload?.()}catch"
          new="status58('#me58SectionStatus','Seções salvas. Recarregando música…','ok');await core58.reload?.();draft58=current58.arrangement.length?[...current58.arrangement]:uniqueSections58(current58.raw,true);renderRows58();renderAvailable58();renderOrder58()}catch"
          if old not in s: raise SystemExit('section refresh hook not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate refined V5.8
        run: |
          grep -q 'renderAvailable58();renderOrder58()' live-v5/v58-song-editor.js
          node --check live-v5/v58-song-editor.js
          grep -q 'SemeandoV58?.arrangeSlides' live-v5/index.html
      - name: Commit refinement
        run: |
          git config user.name 'Legacy desenvolvedor'
          git config user.email '103953894+JET-SOUZA@users.noreply.github.com'
          git add live-v5/v58-song-editor.js
          git commit -m 'Refresh V5.8 editor after section save'
          git push
