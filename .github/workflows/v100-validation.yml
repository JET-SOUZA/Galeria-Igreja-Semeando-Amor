name: V10 Arena Validation
on:
  push:
    paths:
      - 'live-v5/v59-setlist.js'
      - 'live-v5/v83-output-compositor.js'
      - 'live-v5/v100-arena-workspace.js'
      - '.github/workflows/v100-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and bootstrap
        run: |
          node --check live-v5/v59-setlist.js
          node --check live-v5/v83-output-compositor.js
          node --check live-v5/v100-arena-workspace.js
          grep -q "v83-output-compositor.js?v=8302" live-v5/v59-setlist.js
          grep -q "v100-arena-workspace.js?v=10001" live-v5/v59-setlist.js
          grep -q "V10 · ARENA WORKSPACE" live-v5/v59-setlist.js
          ! grep -qi "service_role" live-v5/v100-arena-workspace.js
      - name: Install DOM dependency
        run: npm install --no-save --ignore-scripts jsdom@26.1.0
      - name: Behavior test
        run: |
          node <<'NODE'
          const fs=require('fs');
          const assert=require('assert');
          const {JSDOM}=require('jsdom');
          const dom=new JSDOM('<!doctype html><body><div id="operator"><div class="top"></div><div class="layout"></div></div><div id="v80workspace"></div><div id="v90grid"><span id="v9deckname">Louvor Teste</span><div id="v9grid"></div></div></body>',{url:'https://example.test/',runScripts:'outside-only',pretendToBeVisual:true});
          const w=dom.window;
          const songs=[{id:'s1',title:'Louvor Teste',artist:'Igreja'}];
          const slides=[{id:'p1',label:'Verso 1',body:'Linha 1\nLinha 2',sort_order:0},{id:'p2',label:'Refrão',body:'Refrão aqui',sort_order:1}];
          const media=[{id:'m1',title:'Fundo Azul',type:'image',url:'https://example.test/bg.jpg',created_at:'2026-01-01'}];
          function query(table){let data=table==='sl_songs'?songs:table==='sl_media'?media:slides;const chain={select(){return chain},order(){return Promise.resolve({data,error:null})},limit(){return Promise.resolve({data,error:null})},eq(){return chain}};return chain}
          w.supabase={createClient:()=>({from:query})};
          let takePart=-1,compTake=0,compClear=0;
          w.SemeandoV84={chooseSong:()=>{},takePart:i=>{takePart=i}};
          w.SemeandoV90={loadSong:()=>{},previewPart:()=>{},takePart:()=>{}};
          w.SemeandoV92={cells:()=>{}};
          w.SemeandoV93={preview:()=>{}};
          w.SemeandoV94={getFx:()=>({opacity:100,scale:100,x:50,y:50,blend:'normal',darken:0,transition:'fade',loop:true}),setFx:()=>{}};
          w.SemeandoV96={refresh:()=>{}};
          w.SemeandoV97={save:()=>{},applySelected:()=>{},copy:()=>{},paste:()=>{},applyPreset:()=>{}};
          w.SemeandoV83={take:()=>{compTake++;return true},clear:()=>{compClear++;return true}};
          w.SemeandoV75={toast:()=>{}};
          w.eval(fs.readFileSync('live-v5/v100-arena-workspace.js','utf8'));
          w.document.dispatchEvent(new w.Event('DOMContentLoaded'));
          setTimeout(async()=>{
            try{
              assert.ok(w.document.querySelector('#v100arena'),'workspace did not mount');
              assert.ok(w.document.body.classList.contains('v100-on'),'new workspace not active');
              assert.ok(w.document.querySelector('#v100take'),'take button missing');
              assert.ok(w.document.querySelector('#v100assets'),'browser missing');
              await w.SemeandoV100.chooseSong(songs[0]);
              assert.equal(w.document.querySelectorAll('#v100grid [data-column]').length,6,'columns missing');
              assert.ok(w.document.querySelector('#v100grid [data-clip="text:0"]'),'real song part missing');
              w.SemeandoV100.setCell('background',0,media[0]);
              let cells=JSON.parse(w.localStorage.getItem('sl_v92_cells'));
              assert.equal(cells['Louvor Teste|background|0'].title,'Fundo Azul');
              w.SemeandoV100.previewColumn(0);
              assert.ok(w.document.querySelector('#v100preview .v100lyrics'),'preview lyrics missing');
              await w.SemeandoV100.takeColumn(0);
              assert.equal(takePart,0,'song part was not sent live');
              assert.equal(compTake,1,'visual compositor was not triggered');
              let ls=JSON.parse(w.localStorage.getItem('sl_v80_layers'));
              assert.equal(ls.background.title,'Fundo Azul','background did not reach live layer store');
              assert.ok(fs.readFileSync('live-v5/v100-arena-workspace.js','utf8').includes('@media(max-width:650px)'),'mobile layout missing');
              console.log('V10 behavior test passed');
              w.close();
            }catch(e){console.error(e);w.close();process.exitCode=1}
          },500);
          NODE