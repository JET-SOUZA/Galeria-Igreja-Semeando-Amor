name: Upgrade Semeando Live V5.4 Live Control

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/upgrade-v54-live-control.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V5.4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('live-v5/index.html')
          s=p.read_text()
          old=s
          s=s.replace('V5.3 · MÍDIA + PRODUÇÃO','V5.4 · LIVE CONTROL')
          s=s.replace('</style></head>', '''.screenText,.outText,.outBg,.outLower{transition:opacity .22s ease,transform .22s ease,filter .22s ease}.taking .screenText{opacity:.18;transform:scale(.985)}.takeOk .screenText{animation:takeIn .28s ease}.output .outText{transition:opacity .25s ease,transform .25s ease}.shortcutGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.shortcutItem{display:flex;justify-content:space-between;gap:12px;border:1px solid var(--line);background:#11161f;border-radius:10px;padding:10px;font-size:10px}.shortcutItem kbd{border:1px solid #46505f;background:#080b10;border-radius:6px;padding:3px 7px;font-weight:900}.recoveryHint{font-size:9px;color:#9fc8ad;margin-top:7px}.stagePart{font-size:11px;font-weight:900;letter-spacing:.08em;color:#ffb37d}@keyframes takeIn{from{opacity:.25;transform:scale(.985)}to{opacity:1;transform:scale(1)}}@media(max-width:760px){.shortcutGrid{grid-template-columns:1fr}}</style></head>''')
          s=s.replace('<button id="contentHub" class="topBtn">Conteúdo</button>','<button id="shortcuts" class="topBtn">Atalhos</button><button id="contentHub" class="topBtn">Conteúdo</button>')
          s=s.replace('<button id="prodUndo" class="btn" type="button">Desfazer</button></div></div>','<button id="prodUndo" class="btn" type="button">Desfazer</button><button id="restoreLast" class="btn" type="button">Restaurar último</button></div><div class="recoveryHint">O último estado ao vivo fica salvo neste computador para recuperação rápida.</div></div>')
          marker='<dialog id="songDialog" class="dialog">'
          dialog='''<dialog id="shortcutDialog" class="dialog"><div class="dialogBox"><div class="dialogHead"><h2>Atalhos de operação</h2><button id="xShortcuts" class="x" type="button">×</button></div><div class="shortcutGrid"><div class="shortcutItem"><span>IR AO AR</span><kbd>Espaço</kbd></div><div class="shortcutItem"><span>IR AO AR alternativo</span><kbd>Ctrl/⌘ + Enter</kbd></div><div class="shortcutItem"><span>Próximo</span><kbd>→</kbd></div><div class="shortcutItem"><span>Anterior</span><kbd>←</kbd></div><div class="shortcutItem"><span>Blackout</span><kbd>B</kbd></div><div class="shortcutItem"><span>Limpar texto</span><kbd>C</kbd></div><div class="shortcutItem"><span>Desfazer</span><kbd>U</kbd></div><div class="shortcutItem"><span>Parte da música</span><kbd>1–9</kbd></div><div class="shortcutItem"><span>Parte direto AO AR</span><kbd>Shift + 1–9</kbd></div></div><p class="hint">Os atalhos ficam desativados enquanto você digita em campos de texto.</p></div></dialog>'''
          if marker in s and 'id="shortcutDialog"' not in s:
              s=s.replace(marker,dialog+marker)
          old_take="async function take(){A.history.push(structuredClone(A.live));const s={...A.preview,blackout:false,updatedAt:new Date().toISOString()};"
          new_take="async function take(){saveRecovery();pulseTake();A.history.push(structuredClone(A.live));const s={...A.preview,blackout:false,updatedAt:new Date().toISOString()};"
          s=s.replace(old_take,new_take)
          old_slide="A.preview=mk('song',s.body,'',bg,'LOUVOR');A.preview.next=n?.body||'—';showSlides();render()"
          new_slide="A.preview=mk('song',s.body,'',bg,'LOUVOR');A.preview.next=n?.body||'—';A.preview.partLabel=s.label||('Parte '+(A.slide+1));A.preview.partIndex=A.slide+1;A.preview.partTotal=A.slides.length;showSlides();render()"
          s=s.replace(old_slide,new_slide)
          insert="""function saveRecovery(){try{localStorage.setItem('sl_v54_recovery_'+A.channel,JSON.stringify(A.live))}catch{}}async function restoreRecovery(){try{const raw=localStorage.getItem('sl_v54_recovery_'+A.channel);if(!raw)return setProdStatus('Nenhum estado salvo para restaurar.');const state=JSON.parse(raw);A.history.push(structuredClone(A.live));await publish(A.channel,{...state,blackout:false,updatedAt:new Date().toISOString()},'recovery');setProdStatus('Último estado restaurado.',true)}catch{setProdStatus('Não foi possível restaurar o estado.')}}function pulseTake(){const el=$('#live');if(!el)return;el.classList.remove('takeOk');el.classList.add('taking');setTimeout(()=>{el.classList.remove('taking');el.classList.add('takeOk')},120);setTimeout(()=>el.classList.remove('takeOk'),520)}function openShortcuts(){$('#shortcutDialog')?.showModal()}function closeShortcuts(){$('#shortcutDialog')?.close()}"""
          s=s.replace('function tabs(){',insert+'function tabs(){')
          s=s.replace("$('#contentHub').onclick=()=>window.open('https://semeando-live-conteudo.vercel.app','sl-content');","$('#shortcuts').onclick=openShortcuts;$('#xShortcuts').onclick=closeShortcuts;$('#contentHub').onclick=()=>window.open('https://semeando-live-conteudo.vercel.app','sl-content');")
          s=s.replace("$('#prodUndo').onclick=undo;","$('#prodUndo').onclick=undo;$('#restoreLast').onclick=restoreRecovery;")
          old_keys="else if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);else if(e.key.toLowerCase()==='b')blackout()"
          new_keys="else if(e.code==='Space'){e.preventDefault();take()}else if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);else if(e.key.toLowerCase()==='b')blackout();else if(e.key.toLowerCase()==='c')clear();else if(e.key.toLowerCase()==='u')undo()"
          s=s.replace(old_keys,new_keys)
          old_stage="if(isStage)$('#nextText').textContent=s.next||'—';"
          new_stage="if(isStage){$('#nextText').textContent=s.next||'—';if(s.partLabel)$('#outKicker').textContent=((s.partIndex&&s.partTotal)?(s.partIndex+'/'+s.partTotal+' · '):'')+s.partLabel;}"
          s=s.replace(old_stage,new_stage)
          if s==old:
              raise SystemExit('No V5.4 changes applied')
          p.write_text(s)
          PY
      - name: Static validation
        run: |
          grep -q 'V5.4 · LIVE CONTROL' live-v5/index.html
          grep -q 'restoreRecovery' live-v5/index.html
          grep -q 'shortcutDialog' live-v5/index.html
          grep -q 'partTotal' live-v5/index.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('live-v5/index.html').read_text()
          js=re.findall(r'<script>(.*?)</script>',s,re.S)[-1]
          Path('/tmp/v54.js').write_text(js)
          PY
          node --check /tmp/v54.js
      - name: Commit V5.4
        run: |
          git config user.name 'Legacy desenvolvedor'
          git config user.email '103953894+JET-SOUZA@users.noreply.github.com'
          git add live-v5/index.html
          git commit -m 'Upgrade Semeando Live to V5.4 live control'
          git push
