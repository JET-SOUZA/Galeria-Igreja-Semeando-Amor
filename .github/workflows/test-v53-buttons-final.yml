name: Test Semeando Live V5.3 Buttons Final

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-v53-buttons-final.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser test
        run: |
          cat > test-v53.mjs <<'JS'
          import { chromium } from 'playwright';
          import { spawn } from 'node:child_process';
          const server=spawn('python3',['-m','http.server','8765'],{stdio:'ignore'}),wait=ms=>new Promise(r=>setTimeout(r,ms));await wait(700);
          const browser=await chromium.launch({headless:true}),page=await browser.newPage({viewport:{width:1280,height:900}}),errs=[];
          page.on('pageerror',e=>errs.push(e.message));
          await page.route('https://cdn.jsdelivr.net/**',async r=>r.fulfill({status:200,contentType:'application/javascript',body:`window.supabase={createClient(){const song={id:'s1',title:'Louvor Teste',artist:'Equipe',key_signature:'G'},slides=[{id:'1',song_id:'s1',label:'Verso 1',body:'Linha 1\\nLinha 2',sort_order:0},{id:'2',song_id:'s1',label:'Refrão',body:'Refrão\\nLinha',sort_order:1}],service={id:'svc',title:'Culto Teste',status:'live'},profile={full_name:'Operador',role:'admin',is_active:true},live={revision:1,state:{type:'welcome',title:'BEM-VINDOS',body:'Teste',background:0,kicker:'WELCOME',blackout:false}};const R=(t,m,p)=>t==='sl_profiles'?{data:profile,error:null}:t==='sl_services'?{data:[service],error:null}:t==='sl_service_items'?{data:[],error:null}:t==='sl_songs'?{data:[song],error:null}:t==='sl_song_slides'?{data:slides,error:null}:t==='sl_live_state'?{data:m==='update'?{revision:2,state:p||live.state}:live,error:null}:t==='sl_scripture_cache'?{data:[],error:null}:{data:[],error:null};function q(t,m='select',p=null){const o={select(){return o},eq(){return o},in(){return o},order(){return o},limit(){return o},insert(v){return q(t,'insert',v)},update(v){return q(t,'update',v)},upsert(v){return q(t,'upsert',v)},maybeSingle(){return Promise.resolve(R(t,m,p))},single(){return Promise.resolve(R(t,m,p))},then(a,b){return Promise.resolve(R(t,m,p)).then(a,b)}};return o}return{auth:{getSession:async()=>({data:{session:{user:{id:'u'}}}}),getUser:async()=>({data:{user:{id:'u'}}}),signOut:async()=>({})},from:t=>q(t),channel:()=>({on(){return this},subscribe(cb){setTimeout(()=>cb('SUBSCRIBED'),1);return this}})}}};` }));
          await page.goto('http://127.0.0.1:8765/live-v5/index.html');await page.waitForSelector('#operator:not(.hide)',{timeout:10000});
          const click=async s=>{await page.locator(s).first().click();await wait(60)},pass=async(n,f)=>{await f();console.log('PASS',n)};
          await pass('preview',async()=>{await page.fill('#ctTitle','Teste');await page.fill('#ctBody','Corpo');await click('#prepare')});
          await pass('take',()=>click('#take'));await pass('next-prev',async()=>{await click('#next');await click('#prev')});await pass('clear-black-undo',async()=>{await click('#clear');await click('#black');await click('#undo')});
          await pass('song preview',async()=>{await click('[data-tab="songs"]');await click('.song .pv');await page.waitForSelector('#songNow:not(.hide)');if(await page.locator('.slide').count()<2)throw Error('song slides')});
          await pass('song buttons',async()=>{await click('.previewSlide');await click('.goSlide')});
          await pass('bible',async()=>{await click('[data-tab="bible"]');await page.fill('#verseRef','João 3:16');await page.fill('#verseText','Texto');await click('#previewBible')});
          await pass('lower third',async()=>{await click('[data-tab="production"]');await page.fill('#lowerTitle','Pr. Teste');await click('#previewLower');await click('#liveLower');await click('#clearLower')});
          await pass('quick message',async()=>{await page.fill('#quickTitle','Aviso');await page.fill('#quickBody','Teste');await click('#previewQuick');await click('#liveQuick')});
          await pass('stage timer',async()=>{await page.fill('#timerMinutes','1');await click('#startTimer');await click('#resetTimer')});
          await pass('media',async()=>{await click('[data-tab="media"]');await page.waitForSelector('.bgPreset');await click('.bgPreset');await page.fill('#mediaImageUrl','https://example.com/a.jpg');await click('#previewImageBg');await click('#clearImageBg')});
          await pass('countdown',async()=>{await page.fill('#countdownMinutes','1');await click('#startCountdownPreview');await click('#stopCountdown')});
          await pass('notice',async()=>{await page.fill('#noticeTitle','AVISO');await page.fill('#noticeBody','Mensagem');await click('#noticePreview');await click('#noticeLive')});
          await pass('quick scene',()=>click('.quickScene'));await pass('cult mode',async()=>{await click('#cult');if(!(await page.locator('body').getAttribute('class')||'').includes('cult'))throw Error('cult');await click('#cult')});
          if(errs.length)throw Error('page errors: '+errs.join(' | '));console.log('ALL_BUTTON_TESTS_PASSED');await browser.close();server.kill();
          JS
          node test-v53.mjs
